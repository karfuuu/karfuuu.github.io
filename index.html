*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;min-height:640px}
/* top bar */
.top{min-width:0;display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 8px;height:32px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;min-width:0}
.search kbd{font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;height:32px;min-width:32px;padding:0 8px;color:var(--mute)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
/* main */
.main{display:grid;grid-template-columns:minmax(200px,250px) 1fr;min-height:0}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:6px 0 12px}
.grp{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:10px 12px 3px;display:flex;align-items:center;gap:6px}
.sub{font-size:11px;color:var(--faint);padding:6px 12px 1px 26px}
.li{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 12px;margin:0 6px;border-radius:5px;cursor:pointer;color:var(--ink);font-size:13.5px;line-height:1.35}
.li:hover{background:var(--hover)}
.li.sel{background:var(--sel);color:var(--selink);font-weight:550}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .b{font-size:11px;color:var(--faint);flex:none}
.li .m{font-size:10.5px;color:var(--faint);flex:none}
.empty{padding:16px 14px;color:var(--mute);font-size:13px}
/* detail */
.detail{overflow:auto;min-width:0}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.back{display:none}
.badge{font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:1px 7px;flex:none}
.dh h1{font-size:17px;font-weight:650;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .reg{font-size:12px;color:var(--mute);white-space:nowrap}
.star{border:0;background:transparent;font-size:18px;line-height:1;color:var(--faint);padding:2px 4px}
.star.on{color:#e3a008}
.body{padding:12px 16px 90px;max-width:900px}
.sec{margin:0 0 14px}
.sech{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sech .n{font:600 11px ui-monospace,monospace;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.cardbar{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.cardbar .lbl{flex:1;font-size:12.5px;color:var(--mute);min-width:0}
.copy{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:4px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.copy:hover{filter:brightness(1.07)}
.copy.ok{background:var(--ok)}
.add{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12.5px;color:var(--mute)}
.add:hover{color:var(--ink);background:var(--hover)}
.txt{padding:8px 12px 10px;overflow-wrap:anywhere;font-size:13.5px;line-height:1.5;cursor:copy}
.txt .ln{white-space:pre-wrap}
.txt .gap{height:1.5em}
.txt:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.card.flash .txt{background:var(--okbg)}
mark.ph{background:var(--ph);color:var(--phink);border-radius:3px;padding:0 2px;font-weight:600}
span.opt{background:var(--opt);color:var(--optink);border-radius:3px;padding:0 2px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.seg button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:2px 10px;font-size:12.5px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.ilab{font-size:11.5px;font-weight:600;color:var(--mute);padding:6px 12px 3px;background:var(--panel);border-top:1px solid var(--line)}
.ilab:first-child{border-top:0}
.item{display:flex;gap:8px;align-items:flex-start;padding:6px 8px 6px 12px;border-top:1px solid var(--line);cursor:copy}
.ilab+.item,.items>.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.item .it{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.5}
.item .ic{flex:none;font-size:11.5px;color:var(--faint);padding-top:2px;opacity:0;transition:opacity .1s}
.item:hover .ic{opacity:1}
.item .add{flex:none;padding:0 7px;line-height:20px}
.item.flash{background:var(--okbg)}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--phink);background:var(--ph);border-radius:6px;padding:5px 10px}
.info{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);font-size:13.5px}
.info p{margin:4px 0}.info ul,.info ol{margin:4px 0;padding-left:20px}
.info table{border-collapse:collapse;width:100%;margin:4px 0}
.info td{border-top:1px solid var(--line);padding:4px 8px 4px 0;vertical-align:top}
.info tr:first-child td{border-top:0}
.info td:first-child{color:var(--mute);white-space:nowrap;padding-right:14px;width:1%}
[hidden]{display:none!important}
/* ausfüller */
input.phin{font:inherit;font-weight:600;color:var(--phink);background:var(--ph);border:1px dashed color-mix(in srgb,var(--phink) 50%,transparent);border-radius:4px;padding:0 4px;margin:0 1px;max-width:100%;line-height:1.3;cursor:text}
input.phin:focus{outline:2px solid var(--accent);outline-offset:0;border-style:solid}
input.phin.filled{background:var(--okbg);color:var(--ink);border-color:transparent;font-weight:500}
select.phsel{font:inherit;color:var(--phink);background:var(--ph);border:1px dashed color-mix(in srgb,var(--phink) 50%,transparent);border-radius:4px;padding:0 1px;max-width:100%;cursor:pointer}
select.phsel.set{background:var(--okbg);color:var(--ink);border-color:transparent}
span.opt{cursor:pointer}
span.opt.on{background:var(--okbg);color:var(--ink)}
span.opt.off{text-decoration:line-through;opacity:.45;background:transparent}
.fillhint{font-size:11.5px;color:var(--faint);padding:0 12px 7px}
.sidesw{display:inline-flex;gap:3px;align-items:center;font-size:11.5px;color:var(--mute);white-space:nowrap}
.sidesw button{border:1px solid var(--line2);background:var(--bg);border-radius:5px;padding:0 7px;font-size:12px;color:var(--mute);line-height:20px}
.sidesw button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* rechner */
.calc{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px 12px;display:grid;gap:10px}
.cform{display:grid;gap:10px}
.cf{display:grid;gap:4px;min-width:0}
.cl{font-size:11.5px;font-weight:650;color:var(--mute)}
.cseg{display:flex;flex-wrap:wrap;gap:4px}
.cseg.col{flex-direction:column;align-items:stretch}
.cseg button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:4px 9px;font-size:12.5px;color:var(--ink);text-align:left;line-height:1.35}
.cseg button:hover{background:var(--hover)}
.cseg button.on{background:var(--sel);border-color:var(--accent);color:var(--selink);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cinp{display:flex;align-items:center;gap:6px}
.cinp input{font:inherit;width:100%;min-width:0;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.cinp input:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.cu{font-size:12px;color:var(--mute)}
.cres{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.pillc{display:inline-block;border-radius:6px;padding:2px 10px;color:#fff;font-weight:700;font-size:14px}
.tone-ok{background:#1f8a4c}.tone-mid{background:#b07800}.tone-warn{background:#d0611a}.tone-bad{background:#c4362b}.tone-none{background:#6f6e69}
.chead{font-size:13.5px;font-weight:600}
.cnote{font-size:13px;line-height:1.45;margin:0;padding-left:18px;color:var(--ink)}
.csrc{font-size:11.5px;color:var(--faint)}
/* vorschläge */
.ibx{padding:12px 16px 120px;max-width:900px;display:grid;gap:8px}
.ibx .sech{margin:8px 0 0}
.ibrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.ibrow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ibrow input[type=checkbox]{margin-top:6px;width:16px;height:16px}
.ibrow textarea{font:inherit;font-size:13.5px;width:100%;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--ink);resize:vertical}
.ibrow select{grid-column:2;font-size:12px;max-width:100%;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:2px 4px}
.ibsrc{grid-column:2;font-size:11.5px;color:var(--faint)}
.mp{font-size:13px;margin:4px 0 8px}.mp a{color:var(--accent)}
.mrow{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.mbox h3{font-size:13.5px;margin:14px 0 2px}
.mbox{max-height:calc(100% - 32px);overflow:auto}
/* editor */
.newtpl{display:block;margin:4px 8px 6px;width:calc(100% - 16px);border:1px dashed var(--line2);background:transparent;border-radius:6px;padding:5px 8px;color:var(--accent);font-size:13px;text-align:left}
.newtpl:hover{background:var(--hover)}
.ed{padding:12px 16px 120px;max-width:900px;display:grid;gap:12px}
.edbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.edbar h1{font-size:16px;margin:0;flex:1;min-width:0}
.edgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ed label{display:grid;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute)}
.ed input,.ed select,.ed textarea{font-family:inherit;font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.ed input:focus,.ed select:focus,.ed textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.ed textarea{resize:vertical;white-space:pre-wrap}
.esec{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;display:grid;gap:8px}
.esh{display:flex;align-items:center;gap:6px}
.esh .ty{font-size:11px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.esh input{flex:1}
.mini{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.mini:hover{color:var(--ink);background:var(--hover)}
.mini.danger{color:#c4362b;border-color:color-mix(in srgb,#c4362b 40%,var(--line2))}
.egrp{display:grid;gap:6px;border-left:2px solid var(--line2);padding-left:8px}
.eitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px;align-items:start}
.eitem select{grid-column:1/2;font-size:12px;padding:2px 6px}
.eitem .mini{grid-row:1/3;grid-column:2}
.eadd{display:flex;gap:6px;flex-wrap:wrap}
.enote{font-size:12px;color:var(--mute)}
/* befund-baukasten */
.kit{border-top:1px solid var(--line);background:var(--panel);display:none;min-width:0}
.kit.on{display:block}
.kbar{display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
.kbar .bt{font-size:12.5px;font-weight:650;color:var(--ink)}
.kbar .bs{font-size:12.5px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpanel{display:none;max-height:min(52vh,460px);overflow:auto;border-bottom:1px solid var(--line);background:var(--bg);padding:10px 12px;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.kit.open .kpanel{display:grid}
.kh{font-size:11.5px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px;padding:6px 0;border-top:1px solid var(--line)}
.krow:first-of-type{border-top:0}
.krow .kt{font-size:12.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.krow select{grid-column:1/2;font:12px inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:2px 4px;min-width:0;max-width:100%}
.krow .rm{grid-row:1/3;grid-column:2;align-self:start;border:0;background:transparent;color:var(--faint);font-size:14px;padding:0 4px}
.krow .rm:hover{color:var(--ink)}
.kout{font-size:13px;line-height:1.5;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.kout .ln{white-space:pre-wrap}.kout .gap{height:1.5em}
.kout .ins{background:var(--okbg);border-radius:3px;box-shadow:-3px 0 0 var(--ok)}
.khint{font-size:12px;color:var(--mute);margin-top:6px}
@media (max-width:640px){ .kpanel{grid-template-columns:1fr} }
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;opacity:0;transition:.18s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--bg);border-radius:10px;padding:14px;width:min(640px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h2{font-size:15px;margin:0 0 8px}
.mbox textarea{width:100%;height:220px;font:13px/1.5 inherit;border:1px solid var(--line2);border-radius:6px;padding:8px;background:var(--panel);color:var(--ink)}
.mbox .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.help{font-size:13px}.help td{padding:3px 12px 3px 0}.help kbd{font:12px ui-monospace,monospace;border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:var(--panel)}
/* narrow */
@media (max-width:640px){
  .main{grid-template-columns:1fr}
  .app.showdetail .list{display:none}
  .app:not(.showdetail) .detail{display:none}
  .back{display:inline-flex}
  .pills{width:100%;overflow-x:auto;flex-wrap:nowrap}
  .search kbd{display:none}
}
/* ---------- v11: pastell-akzente, bereiche, trainer, lexikon ---------- */
.copy{background:var(--tc,var(--accent));color:var(--onacc)}
.copy.ok{background:var(--ok);color:var(--onacc)}
.copy:disabled{opacity:.45;cursor:default;filter:none}
.badge,.pillc{color:var(--onacc)}
.tone-ok{background:var(--t-ok)}.tone-mid{background:var(--t-mid)}.tone-warn{background:var(--t-warn)}.tone-bad{background:var(--t-bad)}.tone-none{background:var(--t-none)}
.star.on{color:var(--p-fav)}
.sidesw button.on{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:var(--onacc)}
.cseg button.on{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,var(--bg));border-color:var(--tc,var(--accent));color:var(--ink)}
.pill .dot{background:var(--pc)}
.pill.on{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink));color:var(--onacc);font-weight:600}
.pill.on .dot{background:var(--onacc)}
.li .dot{background:var(--mc)}
.li.sel{background:color-mix(in srgb,var(--mc,var(--accent)) 15%,transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--mc,var(--accent))}
.grp{color:var(--gc,var(--faint))}
.grp .dot{background:var(--gc)}
.dh{border-bottom-color:color-mix(in srgb,var(--tc,var(--line)) 40%,var(--line))}
.sech::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--tc,var(--accent));flex:none}
.cardbar,.seg{background:color-mix(in srgb,var(--tc,var(--accent)) 6%,var(--panel))}
.seg button.on{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:var(--onacc)}
.txt:hover,.item:hover{background:color-mix(in srgb,var(--tc,var(--accent)) 7%,transparent)}
.hint{border-left:3px solid color-mix(in srgb,var(--phink) 60%,transparent)}
#kit{--tc:var(--MRT);box-shadow:inset 0 2px 0 color-mix(in srgb,var(--MRT) 55%,transparent)}
.kbar .bt{color:var(--MRT)}
.modes{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.modes button{border:0;background:transparent;border-radius:7px;padding:0 11px;height:26px;font-size:13px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.modes button:hover{color:var(--ink);background:var(--hover)}
.modes button.on{background:color-mix(in srgb,var(--mcol) 20%,transparent);color:var(--mcol)}
.top .spacer{display:none;flex:1}
.logo{width:30px;height:30px;border-radius:8px;flex:none;display:block;box-shadow:0 0 0 1px var(--line),0 2px 10px color-mix(in srgb,var(--MRT) 25%,transparent)}
.logo:not([src]){display:none}
.pane{display:none;min-height:0;overflow:auto}
.app[data-mode="tr"] #trainer,.app[data-mode="lex"] #lexikon{display:block}
.app:not([data-mode="tpl"]) .main,.app:not([data-mode="tpl"]) .kit,.app:not([data-mode="tpl"]) .search,.app:not([data-mode="tpl"]) .pills{display:none!important}
.app:not([data-mode="tpl"]) .top .spacer{display:block}
#trainer{--pcol:var(--m-tr);--tc:var(--m-tr)} #lexikon{--pcol:var(--m-lex);--tc:var(--m-lex)}
.pw{max-width:1000px;margin:0 auto;padding:14px 16px 120px;display:grid;gap:12px;min-width:0}
.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phead h1{font-size:18px;margin:0;color:var(--pcol)}
.phead .ps{font-size:12.5px;color:var(--mute)}
.tin{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 0 color-mix(in srgb,var(--pcol) 70%,transparent)}
.tin:focus-within{border-color:color-mix(in srgb,var(--pcol) 60%,var(--line))}
.tin textarea{display:block;width:100%;min-height:160px;max-height:55vh;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font:13.5px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:10px 12px}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-top:1px solid var(--line);background:var(--panel)}
.tbar .grow{flex:1}
.kh2{opacity:.6;font-weight:500;font-size:11.5px}
.tier{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex:none}
.tier button{border:0;background:var(--bg);padding:2px 9px;font-size:12px;color:var(--mute)}
.tier button+button{border-left:1px solid var(--line2)}
.tier button.on{background:color-mix(in srgb,var(--pcol) 20%,var(--bg));color:var(--ink);font-weight:600}
.status{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--pcol,var(--accent)) 30%,transparent);border-top-color:var(--pcol,var(--accent));animation:bcspin .8s linear infinite;flex:none}
@keyframes bcspin{to{transform:rotate(360deg)}}
.tout{display:grid;gap:12px;min-width:0}
.ocard{--oc:var(--pcol);--tc:var(--oc);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ocard .oh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--oc) 10%,var(--panel));min-height:36px}
.ocard .ot{flex:1;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--oc)}
.ocard .ob{padding:9px 12px 11px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.55}
mark.chg{background:var(--chg);color:var(--chgink);border-radius:3px;padding:0 2px}
.ocard.warn{--oc:var(--t-bad)} .ocard.good{--oc:var(--t-ok)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;min-width:0}
.ogrid:empty{display:none}
.tips{display:grid;gap:10px;padding:10px 12px}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.tip .tn{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--oc) 22%,transparent);color:var(--oc);font-weight:700;font-size:12px;line-height:22px;text-align:center}
.tip .tt{display:block;font-size:13.5px;margin-bottom:1px}
.tip span{font-size:13px;line-height:1.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hsec{margin:6px 0 -4px}
.hist{display:grid;gap:4px}
.hist button{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);min-width:0}
.hist button:hover{background:var(--hover)}
.hist .hd{color:var(--faint);flex:none;font-variant-numeric:tabular-nums}

=== CT | Kopf/Hals | Schädel nativ | cct ccct schädel kopf blutung | fav
## Standardbefund
Technik: Natives Schädel-CT.

Keine Vorbilder zum Vergleich vorliegend.

Mittelständiger Interhemisphärenspalt.
Die inneren und äußeren Liquorräume normal weit.
Reguläre Struktur, Form und Dichte des Gehirns.
Die basalen Zisternen frei.

Kein Nachweis einer intrakraniellen Blutung.
Regelrechte Rinden-Mark-Differenzierung.

Die NNH und Mastoidzellen regelrecht belüftet.
Kein Nachweis einer Fraktur oder suspekter ossärer Läsionen.
## *Textbausteine
- Bds. vereinzelte, periventrikuläre sowie subkortikal gelegene hypodense Marklagerläsionen, in erster Linie im Rahmen einer mikroangiopathischen Leukenzephalopathie zu werten. ⟶ Reguläre Struktur, Form und Dichte des Gehirns.
- Erweiterte innere und äußere Liquorräume ex vacuo.
### Blutung
- Hypodenser bis isodenser, sichelförmiger extraaxialer Saum [rechts/links] frontoparietal mit maximal [XXX] mm Breite, vereinbar mit einem [akuten/subakuten/chronischen] Subduralhämatom. Mittellinienverlagerung um [XXX] mm nach [rechts/links]. ⟶ Mittelständiger Interhemisphärenspalt.
- Hyperdenses Material in den basalen Zisternen und den Sulci [rechts/links] betont, V.a. Subarachnoidalblutung. ⟶ Die basalen Zisternen frei.
### Ischämie
- Hypodenses Areal im [XXX]-Stromgebiet [rechts/links] mit aufgehobener Rinden-Mark-Differenzierung, vereinbar mit einer [subakuten/älteren] Infarktdemarkierung. ⟶ Regelrechte Rinden-Mark-Differenzierung.

- Mukosaverdickung bzw. Flüssigkeitsspiegel in [Sinus maxillaris/Sinus frontalis/Cellulae ethmoidales/Sinus sphenoidalis] [rechts/links/bds.], vereinbar mit einer Sinusitis. ⟶ Die NNH und Mastoidzellen regelrecht belüftet.

      if (rpw != null) vals.push(`einem relativen Washout von ${fmtN(rpw)} %`);
      const befund = `In der ${side} Nebenniere eine glatt begrenzte, ${sz} mm messende Raumforderung${vals.length ? " mit " + joinDe(vals) : ""}${R[3]}.`;
      const sideS = v.side ? (v.side === "rechten" ? "rechts" : "links") : "[rechts/links]";
      return {cat:R[1], tone, head, notes, befund, beurteilung:`Nebennierenraumforderung ${sideS} (${sz} mm)${R[3]}.`, to:"Nebennieren"};
    }
  },
  pirads: {
    title: "PI-RADS v2.1 – Prostataläsion",
    src: "Turkbey B et al. Prostate Imaging Reporting and Data System Version 2.1. Eur Urol 2019;76:340–351",
    fields: [
      {id:"zone", label:"Zone", type:"seg", opts:[["pz","Periphere Zone"],["tz","Transitionszone"]], def:"pz"},
      {id:"t2", label:"T2w-Score (dominant in der TZ)", type:"seg", col:true, def:"", show:v => v.zone === "tz", opts:[
        ["1","1 – Normale TZ oder runder, vollständig gekapselter Knoten"],["2","2 – Überwiegend gekapselter bzw. homogen umschriebener Knoten"],["3","3 – Heterogen, unscharf begrenzt (nicht 2, 4 oder 5)"],["4","4 – Linsenförmig/unscharf, homogen mäßig hypointens, < 15 mm"],["5","5 – Wie 4, aber ≥ 15 mm oder extraprostatische Ausdehnung"]]},
      {id:"dwi", label:"DWI/ADC-Score", type:"seg", col:true, def:"", opts:[
        ["1","1 – Unauffällig in ADC und hohem b-Wert"],["2","2 – Linear/keilförmig ADC-hypo bzw. b-Wert-hyperintens"],["3","3 – Fokal; deutlich nur in ADC oder b-Wert, nicht in beiden"],["4","4 – Fokal deutlich ADC-hypo UND b-Wert-hyperintens, < 15 mm"],["5","5 – Wie 4, aber ≥ 15 mm oder extraprostatische Ausdehnung"]]},
      {id:"dce", label:"DCE (nur PZ relevant)", type:"seg", def:"neg", show:v => v.zone === "pz", opts:[["neg","Negativ"],["pos","Positiv (fokal, früh, korrespondierend)"],["na","Nicht durchgeführt"]]},
      {id:"d", label:"Größe", type:"num", unit:"mm"},
      {id:"loc", label:"Lokalisation", type:"text", ph:"z. B. links posterolateral, Mitte"}
    ],
    compute(v){
      const dwi = +v.dwi, t2 = +v.t2, pz = v.zone === "pz";
      if (!dwi) return {incomplete:"DWI-Score auswählen."};
      if (!pz && !t2) return {incomplete:"T2w-Score auswählen."};
      let cat;
      if (pz){ cat = dwi; if (dwi === 3 && v.dce === "pos") cat = 4; }
      else { cat = t2; if (t2 === 2 && dwi >= 4) cat = 3; if (t2 === 3 && dwi === 5) cat = 4; }
      const d = num(v.d), notes = [];
      if (d != null && d >= 15 && ((pz && dwi === 4) || (!pz && t2 === 4))) notes.push("Größe ≥ 15 mm – passt eher zu Score 5. Score prüfen.");
      const like = ["", "sehr unwahrscheinlich", "unwahrscheinlich", "unklar (intermediär)", "wahrscheinlich", "sehr wahrscheinlich"][cat];
      const mg = cat <= 2 ? "Keine gezielte Biopsie dieser Läsion erforderlich (Zusammenschau mit PSA-Dichte und Klinik)." : cat === 3 ? "Gezielte Biopsie in Zusammenschau mit PSA-Dichte und Klinik erwägen." : "MRT-gezielte Biopsie empfohlen.";
      const tone = cat <= 2 ? "ok" : cat === 3 ? "mid" : cat === 4 ? "warn" : "bad";
      const loc = String(v.loc || "").trim() || "[XXX]", sz = d != null ? fmtN(d) : "[XXX]";
      const det = [ (pz ? "" : `T2w-Score ${t2}, `) + `DWI-Score ${dwi}` ];
      if (pz && v.dce !== "na") det.push("DCE " + (v.dce === "pos" ? "positiv" : "negativ"));
      return {cat:"PI-RADS " + cat, tone, head:`Klinisch signifikantes Karzinom ${like}. ${mg}`, notes,
        befund:`In der ${pz ? "peripheren Zone" : "Transitionszone"} ${loc} eine ${sz} mm messende Läsion (${det.join(", ")}), entsprechend PI-RADS ${cat} (v2.1).`,
        beurteilung:`PI-RADS-${cat}-Läsion der ${pz ? "peripheren Zone" : "Transitionszone"} ${loc} (${sz} mm) – klinisch signifikantes Prostatakarzinom ${like}. ${mg}`, to:"Die Prostata"};
    }
  },
  tirads: {
    title: "ACR TI-RADS – Schilddrüsenknoten",
    src: "Tessler FN et al. ACR Thyroid Imaging, Reporting and Data System (TI-RADS): White Paper. JACR 2017;14:587–595",
    fields: [
      {id:"comp", label:"Zusammensetzung", type:"seg", col:true, def:"", opts:[["cyst","Zystisch / fast vollständig zystisch (0)"],["spong","Spongiform (0)"],["mixed","Gemischt zystisch-solide (1)"],["solid","Solide / fast vollständig solide (2)"]]},
      {id:"echo", label:"Echogenität", type:"seg", col:true, def:"", show:v => v.comp === "mixed" || v.comp === "solid", opts:[["an","Anechogen (0)"],["hyper","Hyper- oder isoechogen (1)"],["hypo","Hypoechogen (2)"],["very","Sehr hypoechogen (3)"]]},
      {id:"shape", label:"Form (transversal)", type:"seg", def:"wide", show:v => v.comp === "mixed" || v.comp === "solid", opts:[["wide","Breiter als hoch (0)"],["tall","Höher als breit (3)"]]},
      {id:"margin", label:"Begrenzung", type:"seg", col:true, def:"smooth", show:v => v.comp === "mixed" || v.comp === "solid", opts:[["smooth","Glatt (0)"],["ill","Unscharf (0)"],["lob","Lobuliert / irregulär (2)"],["ete","Extrathyreoidale Ausdehnung (3)"]]},
      {id:"foci", label:"Echogene Foci (mehrfach möglich; keine bzw. Kometenschweif = 0)", type:"multi", show:v => v.comp === "mixed" || v.comp === "solid", opts:[["macro","Makroverkalkungen (1)"],["rim","Randverkalkung (2)"],["punct","Punktförmige echogene Foci (3)"]]},
      {id:"d", label:"Maximaler Durchmesser", type:"num", unit:"mm"},
      {id:"loc", label:"Lokalisation", type:"text", ph:"z. B. rechten Lappen, kaudal"}
    ],
    compute(v){
      if (!v.comp) return {incomplete:"Zusammensetzung auswählen."};
      const benign = v.comp === "cyst" || v.comp === "spong";
      if (!benign && !v.echo) return {incomplete:"Echogenität auswählen."};
      const P = {cyst:0, spong:0, mixed:1, solid:2, an:0, hyper:1, hypo:2, very:3, wide:0, tall:3, smooth:0, ill:0, lob:2, ete:3, macro:1, rim:2, punct:3};
      const pts = benign ? 0 : P[v.comp] + P[v.echo] + P[v.shape] + P[v.margin] + v.foci.reduce((a, x) => a + P[x], 0);
      const tr = pts === 0 ? 1 : pts <= 2 ? 2 : pts === 3 ? 3 : pts <= 6 ? 4 : 5;
      const notes = [];
      if (benign) notes.push("Zystische und spongiforme Knoten sind per Definition TR1 – keine weiteren Punkte.");
      if (pts === 1) notes.push("1 Punkt ist im ACR-Schema nicht explizit vorgesehen – hier konservativ als TR2 gewertet.");
      const TH = {3:[25, 15, "nach 1, 3 und 5 Jahren"], 4:[15, 10, "nach 1, 2, 3 und 5 Jahren"], 5:[10, 5, "jährlich bis 5 Jahre"]}[tr];
      const d = num(v.d);
      let rec, tone;
      if (tr <= 2){ rec = "Keine FNA, keine Verlaufskontrolle erforderlich."; tone = "ok"; }
      else if (d == null){ rec = `FNA ab ${TH[0]} mm, Verlaufskontrolle ab ${TH[1]} mm (${TH[2]}).`; tone = tr === 3 ? "mid" : tr === 4 ? "warn" : "bad"; }
      else if (d >= TH[0]){ rec = "FNA empfohlen."; tone = tr === 5 ? "bad" : "warn"; }
      else if (d >= TH[1]){ rec = `Keine FNA; sonographische Verlaufskontrolle ${TH[2]}.`; tone = "mid"; }
      else { rec = "Keine FNA oder Verlaufskontrolle erforderlich (unter der Größenschwelle)."; tone = "ok"; }
      const loc = String(v.loc || "").trim() || "[XXX]", sz = d != null ? fmtN(d) : "[XXX]";
      let desc;
      if (benign) desc = `ein ${v.comp === "cyst" ? "zystischer" : "spongiformer"} Knoten mit ${sz} mm`;
      else {
        const A = {mixed:"gemischt zystisch-solider", solid:"solider", an:"anechogener", hyper:"hyper- bis isoechogener", hypo:"hypoechogener", very:"deutlich hypoechogener"};
        const fo = {macro:"Makroverkalkungen", rim:"Randverkalkung", punct:"punktförmigen echogenen Foci"};
        desc = `ein ${A[v.comp]}, ${A[v.echo]} Knoten mit ${sz} mm, ${v.shape === "tall" ? "höher als breit" : "breiter als hoch"}, ${{smooth:"glatt begrenzt", ill:"unscharf begrenzt", lob:"lobuliert bzw. irregulär begrenzt", ete:"mit extrathyreoidaler Ausdehnung"}[v.margin]}${v.foci.length ? ", mit " + joinDe(v.foci.map(x => fo[x])) : ""}`;
      }
      return {cat:`TR${tr} · ${pts} ${pts === 1 ? "Punkt" : "Punkte"}`, tone, head:rec, notes,
        befund:`Im ${loc} ${desc}, entsprechend ACR TI-RADS TR${tr} (${pts} ${pts === 1 ? "Punkt" : "Punkte"}).`,
        beurteilung:`Schilddrüsenknoten ${loc} (${sz} mm), ACR TI-RADS TR${tr}. ${rec}`, to:null};
    }
  },
  volume: {
    title: "Volumen-Rechner",
    src: "Ellipsoidformel V = L x B x H x 0,52 (π/6); Hämatomvolumen nach ABC/2 (Kothari 1996)",
    fields: [
      {id:"mode", label:"Formel", type:"seg", opts:[["ell","Ellipsoid (L x B x H x 0,52)"],["abc","Blutung/Hämatom (A x B x C / 2)"]], def:"ell"},
      {id:"org", label:"Struktur", type:"text", ph:"z. B. Prostata, Schilddrüsenlappen rechts"},
      {id:"a", label:"Länge", type:"num", unit:"mm"},
      {id:"b", label:"Breite", type:"num", unit:"mm"},
      {id:"c", label:"Höhe/Tiefe", type:"num", unit:"mm"},
      {id:"psa", label:"PSA (optional, für PSA-Dichte)", type:"num", unit:"ng/ml", show:v => v.mode === "ell"}
    ],
    compute(v){
      const a = num(v.a), b = num(v.b), c = num(v.c);
      if (a == null || b == null || c == null) return {incomplete:"Drei Durchmesser in mm eingeben."};
      const ell = v.mode === "ell", vol = a * b * c * (ell ? 0.52 : 0.5) / 1000, notes = [];
      const vs = fmtN(vol, vol < 10 ? 1 : 0), org = String(v.org || "").trim();
      const psa = num(v.psa);
      let extra = "";
      if (ell && psa != null && vol > 0){ const dn = psa / vol; notes.push(`PSA-Dichte: **${fmtN(dn, 2)} ng/ml²** (≥ 0,15 gilt als erhöht)`); extra = ` PSA-Dichte ${fmtN(dn, 2)} ng/ml².`; }
      return {cat:`≈ ${vs} ml`, tone:"none", head:ell ? "Ellipsoidformel (π/6 ≈ 0,52)" : "ABC/2-Formel", notes,
        befund:`${org ? ucf(org) : "Volumen"}${org ? " mit" : ":"} ${fmtN(a)} x ${fmtN(b)} x ${fmtN(c)} mm${org ? ", Volumen" : ","} ca. ${vs} ml.${extra}`, beurteilung:"", to:"+"};
    }
  }
};

function parseData(src){
  const out = []; let t = null, s = null;
  const close = () => {
    if (!s) return;
    if (s.lines){ while (s.lines.length && !s.lines[0].trim()) s.lines.shift(); while (s.lines.length && !s.lines[s.lines.length-1].trim()) s.lines.pop(); }
    if (s.type==="block"||s.type==="variant"){ s.text = s.lines.join("\n"); delete s.lines; }
    if (s.groups) s.groups = s.groups.filter(g=>g.items.length);
    t.sections.push(s); s = null;
  };
  for (const raw of src.split("\n")){
    const l = raw.replace(/\s+$/,"");
    if (l.startsWith("=== ")){
      if (t){ close(); out.push(t); }
      const p = l.slice(4).split("|").map(x=>x.trim());
      t = {mod:MODMAP[p[0]], region:p[1], title:p[2], keys:p[3]||"", fav:p.slice(4).includes("fav"), base:(p.slice(4).find(x=>x.startsWith("base="))||"").slice(5), subj:(p.slice(4).find(x=>x.startsWith("subj="))||"").slice(5), sections:[]};
      continue;
    }
    if (!t) continue;
    if (l.startsWith("## ")){
      close(); const x = l.slice(3).trim(), c = x[0];
      if (c==="*") s = {type:"items", title:x.slice(1).trim(), groups:[{label:"",items:[]}], hints:[]};
      else if (c==="?") s = {type:"info", title:x.slice(1).trim(), lines:[], hints:[]};
      else if (c==="@") s = {type:"variant", title:x.slice(1).trim(), lines:[], hints:[]};
      else if (c==="%"){ const id = x.slice(1).trim(); s = {type:"calc", calc:id, title:(CALCS[id]||{}).title||id, hints:[]}; }
      else { const st = splitTarget(x); s = {type:"block", title:st.text, to:st.to, lines:[], hints:[]}; }
      continue;
    }
    if (!s) continue;
    if (l.startsWith("> ")){ s.hints.push(l.slice(2)); continue; }
    if (s.type==="items"){
      if (l.startsWith("### ")) s.groups.push({label:l.slice(4).trim(), items:[]});
      else if (l.startsWith("- ")) s.groups[s.groups.length-1].items.push(splitTarget(l.slice(2)));
    } else if (s.lines) s.lines.push(l);
  }
  if (t){ close(); out.push(t); }
  out.forEach((x,i)=>{ x.id = i; const j = JSON.stringify(x.sections); x.ph = j.includes("[XXX]") || j.includes("[rechts/links]"); });
  return out;
}
const DATA = parseData(document.getElementById("data").textContent);
const MODS = ["CT","MRT","Röntgen","Durchleuchtung","Sono","Intervention"];
const SHORT = {"CT":"CT","MRT":"MRT","Röntgen":"Rö","Durchleuchtung":"DL","Sono":"Sono","Intervention":"Int"};
const REGORDER = ["Kopf/Hals","Thorax","Abdomen/Becken","Gefäße","Wirbelsäule","Obere Extremität","Untere Extremität","Klassifikationen","Spickzettel"];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col = m => "var(--" + m + ")";

/* storage (may be blocked inside embeds) */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("bc_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("bc_"+k, JSON.stringify(v)); }catch(e){} }
};

const S = {
  q: "", filter: store.get("filter","fav"), sel: null,
  favs: new Set(store.get("favs", DATA.filter(t=>t.fav).map(t=>t.title+"|"+t.mod))),
  recent: store.get("recent", []), variant: {}, basket: [], visible: [], units: []
};
const key = t => t.title+"|"+t.mod;
const isFav = t => S.favs.has(key(t));
S.favOrd = store.get("favOrd", false);

/* search haystacks */
for (const t of DATA){
  t.meta = (t.title+" "+t.keys+" "+t.mod+" "+SHORT[t.mod]+" "+t.region).toLowerCase();
  let txt = [];
  for (const s of t.sections){
    txt.push(s.title);
    if (s.text) txt.push(s.text);
    if (s.groups) for (const g of s.groups){ txt.push(g.label); txt.push(...g.items.map(i=>i.text)); }
    if (s.lines) txt.push(...s.lines);
    if (s.type==="calc") txt.push("rechner klassifikation", s.title);
  }
  t.full = txt.join(" ").toLowerCase();
}

/* ---------- pills ---------- */
function renderPills(){
  const defs = [["fav","⭐ Favoriten"],["recent","🕘 Zuletzt"],["top","📊 Meistgenutzt"],["calc","🧮 Rechner"],["all","Alle"]].concat(MODS.map(m=>[m,SHORT[m]]));
  const PC = {fav:"var(--p-fav)", recent:"var(--p-recent)", top:"var(--p-top)", calc:"var(--calc)"};

    const pc = MODS.includes(v) ? col(v) : PC[v];
    const dot = MODS.includes(v) ? `<span class="dot"></span>` : "";
    return `<button class="pill${S.filter===v?" on":""}" data-f="${esc(v)}"${pc ? ` style="--pc:${pc}"` : ""}>${dot}${esc(l)}</button>`;

$("#pills").addEventListener("click", e => {

/* ---------- list ---------- */
function score(t, toks){
  let s = 0;
  for (const k of toks){
    if (t.meta.includes(k)) s += t.title.toLowerCase().includes(k) ? 10 : 6;
    else if (t.full.includes(k)) s += 1;
    else return 0;
  }
  return s;
}
function sortStd(a,b){
  return MODS.indexOf(a.mod)-MODS.indexOf(b.mod) || REGORDER.indexOf(a.region)-REGORDER.indexOf(b.region) || a.title.localeCompare(b.title,"de");
}
function renderList(autoselect){
  const q = S.q.trim().toLowerCase();
  let items;
  if (q){
    const toks = q.split(/\s+/);
    items = DATA.map(t=>[t,score(t,toks)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||sortStd(a[0],b[0])).map(x=>x[0]);
  } else if (S.filter==="fav"){ items = DATA.filter(isFav).sort(sortStd); if (S.favOrd){ const o = [...S.favs]; items.sort((a,b) => o.indexOf(key(a)) - o.indexOf(key(b))); } }
  else if (S.filter==="recent"){ items = S.recent.map(k=>DATA.find(t=>key(t)===k)).filter(Boolean); }
  else if (S.filter==="all"){ items = DATA.slice().sort(sortStd); }
  else if (S.filter==="top"){ items = DATA.filter(t=>S.use[key(t)]).sort((a,b)=>S.use[key(b)]-S.use[key(a)]||sortStd(a,b)); }
  else if (S.filter==="calc"){ items = DATA.filter(t=>t.sections.some(s=>s.type==="calc")).sort(sortStd); }
  else { items = DATA.filter(t=>t.mod===S.filter).sort(sortStd); }
  S.visible = items;
  let h = "";
  if (!items.length){
    h = q ? `<div class="empty">Nichts gefunden für „${esc(S.q)}“.</div>`
          : S.filter==="fav" ? `<div class="empty">Noch keine Favoriten. In einer Vorlage auf ☆ klicken.</div>`
          : S.filter==="top" ? `<div class="empty">Noch nichts gezählt. Das Cockpit zählt mit, welche Vorlagen du kopierst (auf diesem Gerät).</div>`
          : `<div class="empty">Noch nichts geöffnet.</div>`;
  }
  const grouped = !q && S.filter!=="recent" && S.filter!=="top" && S.filter!=="fav";
  const sortable = !q && S.filter==="fav" && items.length > 1;
  if (sortable && !S.favOrd) h += `<div class="favhint">⠿ rechts am Eintrag ziehen = eigene Reihenfolge</div>`;
  let lastMod = null, lastReg = null;
  for (const t of items){
    if (grouped){
      if (S.filter==="fav" || S.filter==="all" || S.filter==="calc"){
        if (t.mod!==lastMod){ h += `<div class="grp" style="--gc:${col(t.mod)}"><span class="dot"></span>${esc(t.mod)}</div>`; lastMod=t.mod; lastReg=null; }
        if (S.filter==="all" && t.region!==lastReg){ h += `<div class="sub">${regIcon(t.region)}${esc(t.region)}</div>`; lastReg=t.region; }
      } else if (t.region!==lastReg){ h += `<div class="grp"${MODS.includes(S.filter) ? ` style="--gc:${col(S.filter)}"` : ""}>${regIcon(t.region)}${esc(t.region)}</div>`; lastReg=t.region; }
    }
    const mtag = (!grouped || S.filter==="recent") ? `<span class="m">${S.filter==="top"&&!q ? (S.use[key(t)]||0)+"× · " : ""}${esc(SHORT[t.mod])}</span>` : "";
    const dot = (!grouped) ? `<span class="dot"></span>` : "";
    h += `<div class="li${S.sel===t.id?" sel":""}" data-id="${t.id}" role="button" tabindex="-1" style="--mc:${col(t.mod)}">${regIcon(t.region)}<span class="t">${esc(t.title)}</span>${mtag}${t.ph?'<span class="b" title="enthält Platzhalter">✎</span>':""}${isFav(t)&&!sortable?'<span class="b">⭐</span>':""}${sortable?'<span class="grip" title="Ziehen zum Sortieren">⠿</span>':""}</div>`;
  }
  if (S.canEdit) h = (S.inbox.length ? `<button class="newtpl ibtn" id="inboxbtn">📥 ${S.inbox.length} Vorschläge für Textbausteine</button>` : "") + `<button class="newtpl" id="newtpl">＋ Neue Vorlage</button>` + h;
  $("#list").innerHTML = h;
  if (autoselect && items.length && !items.some(t=>t.id===S.sel)) select(items[0].id, false);
  scrollSelIntoView();
}

/* ---------- detail ---------- */
function fmt(s){
  let h = esc(s).replace(/\[XXX\]/g, "\u0001");
  h = h.replace(/\[([^\[\]\n]*)\]/g, (m) => `<span class="opt">${m}</span>`);
  return h.replace(/\u0001/g, '<mark class="ph">[XXX]</mark>');
}
function fmtBlock(s){
  let h = "";
  for (const l of s.split("\n")){
    h += l.trim() ? `<div class="ln">${fmt(l)}</div>` : '<div class="gap"></div>';
  }
  return h;
}
function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function infoHtml(lines){
  let h = "", i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (l.startsWith("|")){
      h += "<table>";
      while (i < lines.length && lines[i].startsWith("|")){
        const cells = lines[i].split("|").slice(1,-1).map(c=>c.trim());
        h += "<tr>"+cells.map(c=>`<td>${inl(c)}</td>`).join("")+"</tr>"; i++;
      }
      h += "</table>"; continue;
    }
    if (l.startsWith("- ")){ h += "<ul>"; while (i<lines.length && lines[i].startsWith("- ")){ h += `<li>${inl(lines[i].slice(2))}</li>`; i++; } h += "</ul>"; continue; }

const conceptsOf = s => { s = " "+s.toLowerCase()+" "; return new Set(CONCEPTS.filter(c=>c[1].test(s)).map(c=>c[0])); };

function splitSentences(line){
  const out = []; let cur = "";
  const parts = line.split(/(\s+)/);
  for (let i = 0; i < parts.length; i++){
    cur += parts[i];
    const w = parts[i], nxt = parts[i+2] || "";
    if (/\.$/.test(w) && /^[A-ZÄÖÜ\[]/.test(nxt)){
      const core = w.replace(/[.\])]+$/,"").replace(/^[\[(]+/,"");
      if (core.length >= 4 && !ABBR.has(core.toLowerCase())){ out.push(cur.trim()); cur = ""; i++; }
    }

  if (cur.trim()) out.push(cur.trim());
  return out.length ? out : [line];
}
function baseSlots(){
  if (!S.kit.base) return {lines:[], slots:[]};
  const lines = S.kit.base.text.split("\n"), slots = [];
  lines.forEach((l,k) => { if (l === "\u0000" || isAnchorLine(l)) return; splitSentences(l).forEach((s,j) => slots.push({k, j, s})); });
  return {lines, slots};
}
function bestTarget(text, to, ctx, subj){
  const {slots} = baseSlots(); if (!slots.length) return null;
  if (to){
    if (to === "+") return null;
    const tl = to.toLowerCase();
    const hit = slots.find(x => x.s.toLowerCase().startsWith(tl)) || slots.find(x => x.s.toLowerCase().includes(tl)) || slots.find(x => S.kit.base.text.split("\n")[x.k].toLowerCase().includes(to.toLowerCase()));
    if (hit) return {k:hit.k, j:hit.j};
  }
  let ci = conceptsOf(text); const si = stems(text);
  if (!ci.size && ctx) ci = conceptsOf(ctx);
  if (subj) conceptsOf(subj).forEach(c => ci.add(c));
  const freq = {}; slots.forEach(x => stems(x.s).forEach(w => freq[w] = (freq[w]||0)+1));
  let best = null, bs = 0;
  slots.forEach(x => {
    const cl = conceptsOf(x.s); let c = 0; ci.forEach(y => { if (cl.has(y)) c++; });
    let w = 0; stems(x.s).forEach(y => { if (si.has(y)) w += 1/(freq[y]||1); });

}

function composeKit(){

  const lines = S.kit.base.text.split("\n");
  const by = {}; const tail = [];
  S.kit.items.forEach(it => it.target ? (by[it.target.k+":"+it.target.j] = by[it.target.k+":"+it.target.j] || []).push(it) : tail.push(it));
  lines.forEach((l,k) => {
    if (l === "\u0000"){ out.push({text:"\u0000", ins:false}); return; }
    const hasAny = Object.keys(by).some(x => +x.split(":")[0] === k);
    if (!hasAny){ out.push({text:l, ins:false}); return; }
    const sents = splitSentences(l);
    if (sents.length === 1){ by[k+":0"].forEach(it => it.text.split("\n").forEach(x=>out.push({text:x, ins:true}))); return; }
    const parts = sents.map((s,j) => by[k+":"+j] ? {text:by[k+":"+j].map(it=>it.text.replace(/\n+/g," ")).join(" "), ins:true} : {text:s, ins:false});
    out.push({text:parts.map(p=>p.text).join(" "), ins:true, parts});
  });
  if (tail.length){ out.push({text:"",ins:false}); tail.forEach(it => it.text.split("\n").forEach(x=>out.push({text:x,ins:true}))); }
  const res = []; let gap = false;
  for (const x of out){
    if (x.text === "\u0000"){ gap = true; continue; }

function toDSL(list){

      const pre = s.type==="items" ? "*" : s.type==="info" ? "?" : s.type==="variant" ? "@" : "";
      if (s.type==="calc"){ out.push("## %" + one(s.calc)); (s.hints||[]).map(one).filter(Boolean).forEach(x => out.push("> " + x)); continue; }
      out.push("## " + pre + (one(s.title) || "Text") + (s.type==="block" && s.to ? " ⟶ " + one(s.to) : ""));
      if (s.type==="block" || s.type==="variant") out.push(...String(s.text||"").replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,"")));
      else if (s.type==="info") out.push(...(s.lines||[]));

/* ---------- platzhalter-ausfüller & seitenwahl ---------- */
S.fill = {}; S.side = ""; S.hasSide = false;
const isSideOpts = o => o.length === 2 && o.map(x => x.toLowerCase()).sort().join("/") === "links/rechts";
const sideOpt = o => o.find(x => x.toLowerCase() === S.side);
function tokenizeLine(s, ctr){
  function pushText(out, txt){
    const re = /(rechts\s*\/\s*links|links\s*\/\s*rechts)/gi; let m, last = 0;
    while ((m = re.exec(txt))){
      if (m.index > last) out.push({t:"s", v:txt.slice(last, m.index)});
      out.push({t:"c", i:ctr.n++, opts:m[1].split("/").map(x => x.trim()), raw:m[1], bare:true}); last = re.lastIndex;
    }
    if (last < txt.length) out.push({t:"s", v:txt.slice(last)});
  }
  function parse(str){
    const out = []; let buf = "", p = 0;
    while (p < str.length){
      if (str[p] === "["){
        let d = 0, j = p;
        for (; j < str.length; j++){ if (str[j] === "[") d++; else if (str[j] === "]" && !--d) break; }
        if (j >= str.length){ buf += str[p++]; continue; }
        if (buf){ pushText(out, buf); buf = ""; }
        const inner = str.slice(p + 1, j);
        if (inner === "XXX") out.push({t:"x", i:ctr.n++});
        else if (!/[\[\]]/.test(inner) && inner.includes("/") && inner.split("/").every(o => o.trim() && o.trim().length <= 32)) out.push({t:"c", i:ctr.n++, opts:inner.split("/").map(o => o.trim()), raw:inner});
        else { const i = ctr.n++; out.push({t:"o", i, raw:inner, kids:parse(inner)}); }
        p = j + 1; continue;
      }
      buf += str[p++];
    }
    if (buf) pushText(out, buf);
    return out;
  }
  return parse(s);
}
const TOKCACHE = new Map();
function toksOf(text){ let v = TOKCACHE.get(text); if (!v){ const ctr = {n:0}; v = text.split("\n").map(l => tokenizeLine(l, ctr)); TOKCACHE.set(text, v); } return v; }
const anyTok = (toks, fn) => toks.some(t => fn(t) || (t.t === "o" && anyTok(t.kids, fn)));
const hasFields = text => toksOf(text).some(l => l.some(t => t.t !== "s"));
const hasSideTok = text => toksOf(text).some(l => anyTok(l, t => t.t === "c" && isSideOpts(t.opts)));
function resTok(toks, f){
  let s = "";
  for (const tk of toks){
    if (tk.t === "s") s += tk.v;
    else if (tk.t === "x") s += String(f[tk.i] || "").trim() || "[XXX]";
    else if (tk.t === "c"){ const v = f[tk.i] || (isSideOpts(tk.opts) && S.side ? sideOpt(tk.opts) : ""); s += v || (tk.bare ? tk.raw : "[" + tk.raw + "]"); }
    else { const v = f[tk.i]; if (v === "off") continue; const inner = resTok(tk.kids, f); s += v === "on" ? inner : "[" + inner + "]"; }
  }

}

    let off = false;
    const walk = ts => ts.forEach(t => { if (t.t === "o"){ if (f[t.i] === "off") off = true; else walk(t.kids); } });
    walk(toks);
    let s = resTok(toks, f); if (off) s = tidy(s);
    if (toks[0] && toks[0].t !== "s" && /^[a-zäöü]/.test(s) && /^[A-ZÄÖÜ]/.test(toks[0].t === "c" ? toks[0].opts[0] : (toks[0].raw || ""))) s = s.charAt(0).toUpperCase() + s.slice(1);
    return {text:s, drop: off && !s.trim()};

}
function collapse(lines){ /* lines: [{text, drop}] → strings, ohne doppelte Leerzeilen durch weggelassene Zeilen */
  const out = []; let gap = false;

    if (x.drop){ gap = true; continue; }
    if (!x.text.trim() && gap && out.length && !out[out.length - 1].trim()){ gap = false; continue; }
    out.push(x.text); gap = false;

}

}

function trParse(raw){
  const out = {}; let cur = null;
  for (const line of String(raw || "").replace(/\r/g, "").split("\n")){
    const m = line.match(/^\s*(?:#+\s*)?@@\s*(WARNUNG|V1|V2|BL|BF|TIPPS|FEHLER|SCORE|KARTE)\b[^\n]*$/i);
    if (m){ cur = m[1].toUpperCase(); out[cur] = []; continue; }
    if (cur) out[cur].push(line);
  }
  for (const k in out) out[k] = out[k].join("\n").replace(/^\s*\n/, "").replace(/\s+$/, "");
  if (out.BL) out.BL = out.BL.split("\n").map(l => l.replace(/^\s*(?:[-–—•·▪*]|\d+[.)])\s+/, "")).join("\n");

function mdInline(s){
  let h = esc(String(s || ""));
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function mdHtml(src){
  const L = String(src || "").replace(/\r/g, "").split("\n"); let h = "", i = 0;
  const isSep = r => !r.replace(/[|:\-\s]/g, "");
  const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  const special = /^\s*(```|\||#{1,6}\s|>|[-*•]\s|\d+[.)]\s|(-{3,}|\*{3,}|_{3,})\s*$)/;
  while (i < L.length){
    const l = L[i];
    if (/^\s*```/.test(l)){
      const buf = []; i++;
      while (i < L.length && !/^\s*```/.test(L[i])){ buf.push(L[i]); i++; }
      i++;
      h += `<div class="codeb"><div class="cbh"><span class="note">Befundtext</span><button class="copy" data-cpb>📋 Kopieren</button></div><pre>${esc(buf.join("\n").replace(/\s+$/, ""))}</pre></div>`;
      continue;
    }
    if (/^\s*\|/.test(l)){
      const rows = []; while (i < L.length && /^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      let t = "<table>";
      rows.forEach((r, k) => { if (isSep(r)) return; const tag = k === 0 && rows[1] && isSep(rows[1]) ? "th" : "td"; t += "<tr>" + cells(r).map(c => `<${tag}>${mdInline(c)}</${tag}>`).join("") + "</tr>"; });
      h += t + "</table>"; continue;
    }
    const hm = l.match(/^\s*(#{1,6})\s+(.*)$/);
    if (hm){ const tag = hm[1].length <= 3 ? "h3" : "h4"; h += `<${tag}>${mdInline(hm[2].replace(/\*\*/g, ""))}</${tag}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ h += "<hr>"; i++; continue; }
    if (/^\s*>/.test(l)){ const buf = []; while (i < L.length && /^\s*>/.test(L[i])){ buf.push(L[i].replace(/^\s*>\s?/, "")); i++; } h += `<blockquote>${buf.map(mdInline).join("<br>")}</blockquote>`; continue; }
    if (/^\s*[-*•]\s+/.test(l)){ h += "<ul>"; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])){ h += `<li>${mdInline(L[i].replace(/^\s*[-*•]\s+/, ""))}</li>`; i++; } h += "</ul>"; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)){ h += "<ol>"; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])){ h += `<li>${mdInline(L[i].replace(/^\s*\d+[.)]\s+/, ""))}</li>`; i++; } h += "</ol>"; continue; }
    if (!l.trim()){ i++; continue; }
    const buf = [l]; i++;
    while (i < L.length && L[i].trim() && !special.test(L[i])){ buf.push(L[i]); i++; }
    h += `<p>${buf.map(mdInline).join("<br>")}</p>`;
  }
  return h;
}

  if (m.t === "ping" && m.from !== TAB_ID && S.mode === m.mode) BC.postMessage({t:"pong", to:m.from, from:TAB_ID, q:m.q});
  else if (m.t === "pong" && m.to === TAB_ID){ const r = pongs.get(m.q); if (r) r(m.from); }

function findTab(mode){
  return new Promise(res => {
    if (!BC) return res(null);
    const q = Math.random().toString(36).slice(2);
    const tm = setTimeout(() => { pongs.delete(q); res(null); }, 250);
    pongs.set(q, id => { clearTimeout(tm); pongs.delete(q); res(id); });
    try { BC.postMessage({t:"ping", mode, from:TAB_ID, q}); } catch(e){ clearTimeout(tm); res(null); }
  });
}
async function sendJob(mode, job){

  }
  applyJob(mode, job);
}

const ETIPS = {

  "Anatomie": "Etagen, Segmente und Wurzeln aktiv nachzählen (LWK 4/5: L5 im Rezessus, L4 im Foramen); Lebersegmente nach Couinaud prüfen.",

  "Fehlende Angabe": "Pathologien immer mit Größe (2 Achsen), Lage, Dichte/Signal und KM-Verhalten; ggf. Bild-/Serienummer.",
  "Klassifikation/Empfehlung": "Bei Zufallsbefunden an die passende Leitlinie denken (Fleischner, Bosniak, Nebenniere …) – der 🧮 Rechner liefert den Satz.",

const normCat = k => { k = String(k || "").trim().toLowerCase(); return ECATS.find(c => c.toLowerCase() === k) || ECATS.find(c => k && (c.toLowerCase().startsWith(k.slice(0, 5)) || k.startsWith(c.toLowerCase().slice(0, 5)))) || "Formulierung"; };
function parseJSONish(s){
  if (s == null) return null;
  s = String(s).trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  if (!s || /^keine\b/i.test(s)) return "none";
  try { return JSON.parse(s); } catch(e){}
  const i = s.search(/[\[{]/), j = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if (i >= 0 && j > i){ try { return JSON.parse(s.slice(i, j + 1)); } catch(e){} }
  return null;
}

/* --- geräte-sync über den claude-account (db, privat pro person) --- */
const SY = {db:null, uid:null, on:false, chain:{}};
const P = {
  prefs: () => SY.db.doc("data/users/" + SY.uid + "/prefs"),
  errs: () => SY.db.doc("data/users/" + SY.uid + "/errs"),
  cards: () => SY.db.doc("data/users/" + SY.uid + "/lern").collection("cards"),
  checks: () => SY.db.doc("data/users/" + SY.uid + "/trainer").collection("checks")
};
function syncErr(e){
  const c = e && e.code;
  if (c === "quota_exceeded") toast("Speicher voll – bitte ein paar alte Lernkarten löschen.");
  else if (c === "revoked" || c === "not_granted" || c === "capability_disabled") SY.on = false;
  try { console.warn("sync", c, e && e.message); } catch(x){}
}
function dbq(key, fn){
  const next = (SY.chain[key] || Promise.resolve()).catch(() => {}).then(fn).catch(syncErr);
  SY.chain[key] = next; return next;
}
S.favTs = store.get("favTs", 0);
const prefsObj = () => ({favs:[...S.favs], favTs:S.favTs, favOrd:!!S.favOrd, recent:S.recent.slice(0, 12), use:S.use, iuse:S.iuse || {}});
let prefsT = null, prefsBusy = 0;
function prefsFlush(){
  clearTimeout(prefsT); prefsT = null;
  if (!SY.on) return Promise.resolve();
  const body = Object.assign(prefsObj(), {ts:Date.now()});
  prefsBusy++;
  return dbq("prefs", () => P.prefs().set(body)).finally(() => { prefsBusy--; });
}
function prefsPush(){ if (!SY.on) return; clearTimeout(prefsT); prefsT = setTimeout(prefsFlush, 300); }
store.set = (k, v) => {
  _storeSet(k, v);
  if (k === "favs"){ S.favTs = Date.now(); _storeSet("favTs", S.favTs); }
  if (k === "favs" || k === "recent" || k === "use" || k === "iuse") prefsPush();
};
window.addEventListener("pagehide", () => { if (prefsT) prefsFlush(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && prefsT) prefsFlush(); });
function applyPrefs(d){
  if (!d || prefsT || prefsBusy) return;
  const before = JSON.stringify(prefsObj()), t = DATA[S.sel], wasFav = !!(t && isFav(t));
  let push = false;
  if (Array.isArray(d.favs)){
    const rt = +d.favTs || 0;
    if (!rt){ S.favs = new Set([...d.favs, ...S.favs]); S.favTs = Date.now(); push = true; }
    else if (rt >= S.favTs){ S.favs = new Set(d.favs); S.favTs = rt; if (d.favOrd) S.favOrd = true; }
    else push = true;
  }
  if (Array.isArray(d.recent) && !push) S.recent = d.recent.slice(0, 12);
  if (d.use && typeof d.use === "object"){ const u = Object.assign({}, S.use); for (const [k, n] of Object.entries(d.use)) u[k] = Math.max(u[k] || 0, +n || 0); S.use = u; }
  if (d.iuse && typeof d.iuse === "object"){ const u = Object.assign({}, S.iuse || {}); for (const [k, n] of Object.entries(d.iuse)) u[k] = Math.max(u[k] || 0, +n || 0); S.iuse = u; _storeSet("iuse", u); }
  if (push) prefsPush();
  if (JSON.stringify(prefsObj()) === before) return;
  _storeSet("favs", [...S.favs]); _storeSet("favTs", S.favTs); _storeSet("favOrd", !!S.favOrd); _storeSet("recent", S.recent); _storeSet("use", S.use);
  if (S.mode === "tpl" && !S.edit && !S.view){ renderList(false); if (t && isFav(t) !== wasFav) renderDetail(true); }
  if (S.mode === "home") homeRefresh();
}
async function syncStart(){
  if (!(window.claude && window.claude.use)) return;
  let db = null, u = null, uid = null;
  try { [db, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){ return; }
  if (!db || !u) return;
  try { uid = await u.id(); } catch(e){ uid = null; }
  if (!uid) return;
  SY.db = db; SY.uid = String(uid);
  try { P.prefs(); P.cards(); } catch(e){ SY.db = null; return; }
  SY.on = true;
  const first = store.get("synced", null) !== SY.uid;
  try {
    const snap = await P.prefs().get(), r = snap.exists ? snap.data() : null;
    if (r) applyPrefs(r); else prefsPush();
    if (r && JSON.stringify((r.favs || [])) !== JSON.stringify([...S.favs])) prefsPush();
  } catch(e){ syncErr(e); }
  if (first){
    try {
      const rc = await P.cards().get(), have = new Set(rc.docs.map(d => d.id));
      for (const c of S.cards.values()) if (!have.has(c.id)) await P.cards().doc(c.id).set(c);
      const rh = await P.checks().get(), hh = new Set(rh.docs.map(d => d.id));
      for (const h of S.hist) if (h && h.ts && !hh.has("h" + h.ts)) await P.checks().doc("h" + h.ts).set(h);
      const re = await P.errs().get(), rl = re.exists && Array.isArray(re.data().log) ? re.data().log.slice() : [];
      const seen = new Set(rl.map(x => x.ts));
      await P.errs().set({log:rl.concat(S.errs.filter(x => !seen.has(x.ts))).sort((a, b) => a.ts - b.ts).slice(-400)});
      _storeSet("synced", SY.uid);
    } catch(e){ syncErr(e); }
  }
  P.prefs().onSnapshot(s => { if (!s.metadata.hasPendingWrites && s.exists) applyPrefs(s.data()); }, syncErr);
  P.cards().onSnapshot(s => {
    if (s.metadata.hasPendingWrites) return;
    S.cards = new Map(s.docs.map(d => [d.id, Object.assign({}, d.data(), {id:d.id})])); saveCardsLocal(); learnRefresh();
  }, syncErr);
  P.checks().orderBy("ts", "desc").limit(30).onSnapshot(s => {
    if (s.metadata.hasPendingWrites) return;
    S.hist = s.docs.map(d => d.data()); _storeSet("trhist", S.hist.slice(0, 12));
    if (S.mode === "tr" && !S.tr.busy) renderTrainer();
  }, syncErr);
  P.errs().onSnapshot(s => {
    if (s.metadata.hasPendingWrites || !s.exists) return;
    const l = s.data().log; if (!Array.isArray(l)) return;
    S.errs = l.slice(); _storeSet("errs", S.errs); if (S.mode === "learn" && S.ln.tab === "err") renderLearn();
  }, syncErr);
  if (first) toast("☁️ Favoriten, Lernkarten & Statistik jetzt auf allen Geräten");
  learnRefresh();
}

function errStats(days){

}

function sugClick(e){
  const b = e.target.closest("[data-sg]"); if (!b) return;
  const a = b.dataset.sg, s = S.sug; if (!s) return;
  if (a === "close"){ S.view = null; S.sug = null; renderDetail(); if (window.matchMedia && window.matchMedia("(max-width:640px)").matches) $("#app").classList.add("showdetail"); return; }
  if (a === "all"){ const all = s.items.length && s.items.every(x => x.on); s.items.forEach(x => { x.on = !all; }); renderSug(); return; }
  if (a === "more"){ sugFetch(s.items.length > 0); return; }
  if (a === "reset"){ s.items = []; s.err = ""; sugStore(); sugFetch(false); return; }
  if (a === "take"){
    const pick = s.items.filter(x => x.on && one(x.text)); if (!pick.length) return;
    const t = DATA[s.tid], list = DATA.map(stripTpl), tt = list[s.tid];
    let sec = tt.sections.find(x => x.type === "items");
    if (!sec){ sec = {type:"items", title:"Textbausteine", groups:[], hints:[]}; tt.sections.push(sec); }
    for (const x of pick){
      const lab = one(x.group) || "Vorschläge";
      let g = sec.groups.find(g => g.label === lab); if (!g){ g = {label:lab, items:[]}; sec.groups.push(g); }
      g.items.push({text:one(x.text), to:x.to || null});
    }
    s.items = s.items.filter(x => !x.on); sugStore();
    publishList(list, key(t), `✓ ${pick.length} Textbausteine übernommen – Cockpit lädt neu …`);
  }
}

  S.logLast[k] = now; sess.set("loglast", S.logLast);

function logRange(per){
  const now = new Date(); let from, to = dayKey();
  if (per === "week"){ const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); from = dayKey(d); }
  else if (per === "month"){ from = dayKey(new Date(now.getFullYear(), now.getMonth(), 1)); }
  else if (per === "year"){ from = dayKey(new Date(now.getFullYear(), 0, 1)); }
  else if (per === "custom"){ from = S.lb.from || "0000"; to = S.lb.to || "9999"; }

function logStats(per){
  const [from, to] = logRange(per), byMod = {}, rows = [];
  let total = 0, checks = 0;
  for (const dev of Object.values(S.logAll)){
    for (const [d, slot] of Object.entries((dev && dev.days) || {})){ if (d < from || d > to) continue;
      for (const [mk, n] of Object.entries(slot)){ const [m, r] = mk.split("|"); const o = (byMod[m] = byMod[m] || {n:0, reg:{}}); o.n += n; o.reg[r] = (o.reg[r] || 0) + n; total += n; rows.push([d, m, r, n]); } }
    for (const [d, n] of Object.entries((dev && dev.checks) || {})) if (d >= from && d <= to) checks += n;

  return {total, checks, byMod, rows:rows.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0), from, to};
}

function dragSort(root, itemSel, gripSel, onDrop){
  root.addEventListener("pointerdown", e => {
    const g = e.target.closest(gripSel); if (!g || !root.contains(g)) return;

    e.preventDefault(); e.stopPropagation();
    const box = it.parentElement, items = () => [...box.children].filter(x => x.matches(itemSel));
    const from = items().indexOf(it), scroller = it.closest("#list, #detail") || document.scrollingElement;
    it.classList.add("dragging"); document.body.classList.add("dragsort");
    try { g.setPointerCapture(e.pointerId); } catch(x){}
    let raf = 0, lastY = e.clientY;
    const place = () => {
      raf = 0; const y = lastY;

        if (o === it) continue;
        const r = o.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom){ const before = y < r.top + r.height / 2; if (before && o.previousElementSibling !== it) box.insertBefore(it, o); else if (!before && o.nextElementSibling !== it) box.insertBefore(it, o.nextSibling); break; }
      }
      if (scroller){ const sr = scroller.getBoundingClientRect(); if (y < sr.top + 40) scroller.scrollTop -= 12; else if (y > sr.bottom - 40) scroller.scrollTop += 12; }
    };
    const move = ev => { lastY = ev.clientY; if (!raf) raf = requestAnimationFrame(place); };
    const up = ev => {
      try { g.releasePointerCapture(ev.pointerId); } catch(x){}
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      it.classList.remove("dragging"); document.body.classList.remove("dragsort");
      const to = items().indexOf(it);

    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  });
}

CALCS.kmgfr = {
  title: "KM-Gabe – eGFR, Metformin & Allergie",
  src: "ESUR Guidelines on Contrast Agents v10 (2018) · van der Molen AJ et al., Eur Radiol 2018;28:2845–2855 · eGFR nach CKD-EPI 2021 (Inker LA et al., N Engl J Med 2021;385:1737–1749) · die lokale SOP hat Vorrang",
  fields: [
    {id:"sex", label:"Geschlecht", type:"seg", opts:[["w", "weiblich"], ["m", "männlich"]], def:"w"},
    {id:"age", label:"Alter", type:"num", unit:"Jahre"},
    {id:"cr", label:"Kreatinin", type:"num", unit:"mg/dl"},
    {id:"crU", label:"Einheit", type:"seg", opts:[["mg", "mg/dl"], ["umol", "µmol/l"]], def:"mg"},
    {id:"egfr", label:"oder eGFR vom Labor (optional)", type:"num", unit:"ml/min/1,73 m²"},
    {id:"route", label:"Applikation", type:"seg", col:true, opts:[["iv", "i.v. (z. B. CT)"], ["ia2", "i.a. mit Second-pass-Exposition der Niere (z. B. Becken-Bein-Angio)"], ["ia1", "i.a. mit First-pass-Exposition der Niere (z. B. Herzkatheter, Nierenarterien, Aorta suprarenal)"]], def:"iv"},
    {id:"x", label:"Zusätzlich", type:"multi", opts:[["aki", "V.a. akute Nierenschädigung"], ["icu", "Intensivpatient"], ["met", "nimmt Metformin"], ["dial", "Dialyse"], ["all", "frühere KM-Reaktion"], ["thy", "Hyperthyreose / Autonomie"]]}
  ],
  compute(v){
    const x = v.x || [], has = k => x.includes(k);
    let eg = num(v.egfr), cr = num(v.cr), age = num(v.age), src = "Labor";
    if (eg == null){
      if (cr == null || age == null) return {incomplete:"Alter und Kreatinin eingeben – oder die eGFR direkt vom Labor."};
      const mg = v.crU === "umol" ? cr / 88.4 : cr, f = v.sex === "w", ka = f ? 0.7 : 0.9, al = f ? -0.241 : -0.302;
      eg = 142 * Math.pow(Math.min(mg / ka, 1), al) * Math.pow(Math.max(mg / ka, 1), -1.200) * Math.pow(0.9938, age) * (f ? 1.012 : 1);
      src = "CKD-EPI 2021";
    }
    eg = Math.round(eg);
    const stage = eg >= 90 ? "G1" : eg >= 60 ? "G2" : eg >= 45 ? "G3a" : eg >= 30 ? "G3b" : eg >= 15 ? "G4" : "G5";
    const thr = (v.route === "ia1" || has("icu")) ? 45 : 30;
    const dial = has("dial"), aki = has("aki"), risk = !dial && (aki || eg < thr);
    const notes = [], doc = [];
    const crTxt = cr != null && src !== "Labor" ? ` (Kreatinin ${fmtN(cr, 2)} ${v.crU === "umol" ? "µmol/l" : "mg/dl"})` : "";
    doc.push(`eGFR ${src === "Labor" ? "laut Labor" : "(CKD-EPI 2021)"} ${eg} ml/min/1,73 m²${crTxt}.`);
    let head, tone;
    if (dial){
      head = "Dialysepatient: KM-Gabe möglich – die Dialyse muss laut ESUR nicht an die KM-Gabe angepasst werden."; tone = "mid";
      notes.push("Bei Restdiurese: KM-Menge möglichst gering halten.");
      doc.push("Dialysepflichtiger Patient; KM-Gabe ohne Anpassung des Dialyseregimes gemäß ESUR.");
    } else if (risk){
      head = `Erhöhtes Risiko für eine KM-assoziierte Nierenschädigung (PC-AKI)${aki ? " – V.a. akute Nierenschädigung" : ` – eGFR < ${thr}`}.`; tone = "bad";
      notes.push("Indikation prüfen: Alternative ohne jodhaltiges KM möglich? Nutzen-Risiko-Abwägung dokumentieren.");
      notes.push("Prophylaktische Hydrierung nach SOP, z. B. **NaCl 0,9 % i.v. 1 ml/kg/h 3–4 h vor und 4–6 h nach** KM oder **Natriumbikarbonat 1,4 % 3 ml/kg/h 1 h vor** KM (Vorsicht bei Herzinsuffizienz).");
      notes.push("Niedrigste diagnostisch ausreichende KM-Dosis; Kreatinin nach 48–72 h kontrollieren.");
      doc.push(`Erhöhtes PC-AKI-Risiko gemäß ESUR (${aki ? "V.a. akute Nierenschädigung" : "eGFR < " + thr + " ml/min/1,73 m²" + (v.route === "ia1" ? " bei i.a.-Gabe mit First-pass-Exposition" : has("icu") ? " bei Intensivpatient" : "")}); prophylaktische Hydrierung, minimierte KM-Menge und Kreatininkontrolle nach 48–72 h empfohlen.`);
    } else {
      head = "Kein erhöhtes PC-AKI-Risiko laut ESUR – KM-Gabe ohne Prophylaxe."; tone = eg < thr + 15 ? "mid" : "ok";
      if (eg < thr + 15) notes.push(`Knapp über der Grenze (${thr}) – auf ausreichende Trinkmenge achten.`);
      doc.push("Kein erhöhtes Risiko für eine KM-assoziierte Nierenschädigung gemäß ESUR.");
    }
    if (has("met")){
      const stop = !dial && (eg < 30 || aki || (v.route === "ia1" && eg < 45));
      if (stop){ notes.push("**Metformin** ab der KM-Gabe pausieren, eGFR innerhalb von 48 h kontrollieren, bei stabiler Nierenfunktion wieder ansetzen."); doc.push("Metformin ab KM-Gabe pausieren; Wiederaufnahme nach Kontrolle der Nierenfunktion innerhalb von 48 h."); }
      else { notes.push("**Metformin** kann normal weiter eingenommen werden (eGFR ≥ 30, keine akute Nierenschädigung)."); doc.push("Metformin kann unverändert weiter eingenommen werden."); }
    }
    if (has("all")){
      notes.push("**Frühere KM-Reaktion:** anderes jodhaltiges KM wählen; laut ESUR keine routinemäßige Prämedikation (Evidenz gering) – Haus-SOP beachten; Notfallausrüstung bereithalten, Nachbeobachtung 30 min.");
      doc.push("Anamnestisch frühere KM-Reaktion; Wechsel des KM-Präparats, Nachbeobachtung.");
      if (tone === "ok") tone = "mid";
    }
    if (has("thy")){
      notes.push("**Schilddrüse:** bei manifester Hyperthyreose jodhaltiges KM in der Regel kontraindiziert; bei Risiko (Autonomie, latente Hyperthyreose) Schilddrüsenblockade z. B. mit Perchlorat nach SOP, Endokrinologie einbinden.");
      if (tone === "ok") tone = "mid";
    }
    return {cat:`eGFR ${eg} · ${stage}`, tone, head, notes, befund:doc.join(" "), beurteilung:"", to:"+"};
  }
};

let MCP = undefined;
async function mcpGet(){ if (MCP !== undefined) return MCP; try { MCP = (window.claude && window.claude.use) ? await window.claude.use("mcp") : null; } catch(e){ MCP = null; } return MCP; }
function srcErr(e){
  const c = e && e.code;
  if (c === "server_not_connected" || c === "server_not_found") return "PubMed ist in deinem Claude-Konto nicht verbunden – unter claude.ai › Einstellungen › Konnektoren hinzufügen, dann nochmal klicken.";
  if (c === "needs_reauth") return "Die PubMed-Verbindung ist abgelaufen – unter claude.ai › Einstellungen › Konnektoren neu verbinden.";
  if (c === "selection_required") return "Mehrere PubMed-Verbindungen – bitte in der Abfrage oben eine auswählen und nochmal klicken.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Der Zugriff auf PubMed wurde nicht erlaubt. Beim nächsten Klick fragt Claude erneut.";
  if (c === "blocked_by_policy") return "PubMed ist für dein Konto gesperrt.";
  if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Quellen gehen nur in der Claude-Version des Cockpits.";
  if (c === "server_unavailable" || c === "rate_limited") return "PubMed antwortet gerade nicht – in einer Minute nochmal versuchen.";
  if (c && aiErr) { const m = aiErr(e); if (m) return m; }
  return "Quellen konnten nicht geladen werden – bitte nochmal versuchen.";
}
async function lxSources(i){
  const t = S.lx.turns[i]; if (!t || t.role !== "assistant" || (t.src && t.src.busy) || !S.ai) return;
  const q = (S.lx.turns.slice(0, i).reverse().find(x => x.role === "user") || {}).content || "";
  t.src = {busy:true, items:[], err:""}; lxRenderChat();
  try {
    const mcp = await mcpGet(); if (!mcp) throw {code:"capability_disabled"};
    const ans = String(t.content || "").slice(0, 3500);
    let qs = await S.ai.json(`Formuliere 2 kurze englische PubMed-Suchanfragen (Stichworte, ohne Feld-Tags), mit denen man Leitlinien, Konsensuspapiere oder Übersichtsarbeiten zu den Kernaussagen dieser radiologischen Antwort findet. Nur ein JSON-Array mit 2 Strings.\n\nFRAGE: ${q}\n\nANTWORT:\n${ans}`, {modelTier:"quick"});
    qs = (Array.isArray(qs) ? qs : []).map(x => String(x).trim()).filter(Boolean).slice(0, 2);
    if (!qs.length) qs = [q];
    const ids = [];
    for (const qq of qs){
      const r = await mcp.callTool("PubMed", "search_articles", {query:qq, max_results:6, sort:"relevance"});
      const p = (r && r.payload) || {};
      for (const id of (Array.isArray(p.pmids) ? p.pmids : [])) if (!ids.includes(String(id))) ids.push(String(id));
    }
    if (!ids.length){ t.src = {items:[], err:"PubMed hat dazu keine passenden Artikel gefunden."}; lxSave(); lxRenderChat(); return; }
    const m = await mcp.callTool("PubMed", "get_article_metadata", {pmids:ids.slice(0, 10)});
    const arts = (((m && m.payload) || {}).articles || []).map(a => {
      const au = (a.authors || []), first = au[0] ? (au[0].last_name || "") + (au[0].initials ? " " + au[0].initials : "") : "";
      return {pmid:String((a.identifiers || {}).pmid || ""), doi:String(a.doi || (a.identifiers || {}).doi || ""), title:String(a.title || "").replace(/\.$/, ""),
        au:first + (au.length > 1 ? " et al." : ""), j:String((a.journal || {}).iso_abbreviation || (a.journal || {}).title || ""), y:String((a.publication_date || {}).year || ""),
        ty:(a.article_types || []).join(", "), abs:String(a.abstract || "").slice(0, 650)};
    }).filter(a => a.pmid && a.title);
    if (!arts.length) throw {code:"tool_error"};
    const list = arts.map((a, k) => `[${k + 1}] ${a.title} (${a.y}, ${a.j}; ${a.ty})\n${a.abs}`).join("\n\n");
    let pick = await S.ai.json(`Hier ist eine radiologische Lexikon-Antwort und eine Liste von PubMed-Artikeln. Wähle bis zu 4 Artikel, die Kernaussagen der Antwort tatsächlich belegen – Leitlinien, Konsensus- und Übersichtsarbeiten sowie neuere Arbeiten bevorzugt. Passt keiner wirklich, gib [] zurück. Erfinde nichts.\nAntworte nur als JSON-Array: [{"n":1,"why":"welche Aussage er stützt – Deutsch, höchstens 14 Wörter"}]\n\nFRAGE: ${q}\n\nANTWORT:\n${ans}\n\nARTIKEL:\n${list}`, {modelTier:"default"});
    pick = (Array.isArray(pick) ? pick : []).filter(x => x && arts[+x.n - 1]).slice(0, 4);
    const items = pick.map(x => Object.assign({}, arts[+x.n - 1], {why:String(x.why || "").slice(0, 160), abs:undefined}));
    t.src = {items, err:items.length ? "" : "Unter den gefundenen Artikeln belegt keiner die Antwort gut – frag gezielter (z. B. mit Leitlinie oder Klassifikation)."};
  } catch(e){ t.src = {items:[], err:srcErr(e)}; }
  lxSave(); lxRenderChat();
}
function lxSrcHtml(t){
  const s = t.src; if (!s) return "";
  if (s.busy) return `<div class="lxsrc"><div class="status"><span class="spin"></span>sucht in PubMed …</div></div>`;
  if (!s.items.length) return `<div class="lxsrc"><div class="note">${esc(s.err || "Keine Quellen gefunden.")}</div></div>`;

/* ---------- search & keys ---------- */
const qi = $("#q");
qi.addEventListener("input", () => { S.q = qi.value; renderList(true); });
qi.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); move(e.key==="ArrowDown"?1:-1); }
  else if (e.key === "Enter"){ e.preventDefault(); if (S.units.length) copyUnit(0, document.querySelector('[data-u="0"]')); }
  else if (e.key === "Escape"){ if (qi.value){ qi.value=""; S.q=""; renderList(true); } else qi.blur(); }
});
function move(d){
  const v = S.visible; if (!v.length) return;
  let i = v.findIndex(t=>t.id===S.sel); i = i<0 ? 0 : Math.max(0, Math.min(v.length-1, i+d));
  select(v[i].id, true);
}
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("on")){ if (e.key==="Escape") closeModal(); return; }
  if (e.altKey && !e.ctrlKey && !e.metaKey && /^Digit[01234]$/.test(e.code)){ e.preventDefault(); setMode(["home","tpl","tr","lex","learn"][+e.code.slice(5)]); return; }
  if (e.target === qi) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (S.mode !== "tpl") return;
  if (S.edit){ if (e.key === "Escape" && confirmLeave()){ S.edit = null; renderDetail(); } return; }
  if (e.key === "/" || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k")){ e.preventDefault(); qi.focus(); qi.select(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view) return;
  if (/^[1-9]$/.test(e.key)){ const i = +e.key-1; const u = S.units[i]; if (u && !u.item) copyUnit(i, document.querySelector(`[data-u="${i}"]`)); return; }
  if ((e.key === "r" || e.key === "l") && S.hasSide){ setSide(e.key === "r" ? "rechts" : "links"); return; }
  if (e.key === "ArrowDown" || e.key === "j"){ e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp" || e.key === "k"){ e.preventDefault(); move(-1); }
  else if (e.key === "f"){ toggleFav(); }
});
