3. **Zonale Prädominanz?** Ober- vs. Unterfelder · Zentral vs. peripher

### Stauung
- Gering progrediente akzentuierte pulmonale Gefäßzeichnung mit Bild einer basoapikalen Blutumverteilung, zunehmender hilärer Unschärfe sowie Zeichen eines interstitiellen Lungenödems – im Sinne einer pulmonalvenösen Stauung Grad II-III.

- Bei zunehmenden pulmonalvenösen Stauungszeichen in den überlagerungsfrei einsehbaren Lungenabschnitten kein eindeutiger Nachweis flächig infiltrativer Veränderungen. Bei anhaltendem klinischem Verdacht wird nach erfolgter Rekompensation eine bildgebende Verlaufskontrolle empfohlen.
### Infiltrat / Bronchitis
- Hilusinduration mit Kalkeinlagerungen bds. Bronchitis- und Peribronchitiszeichen mit Bronchialmanschetten und verstärkter peribronchialer Streifung bds. perihilär und links im Mittel- und Unterfeld.
- Dabei links im dorsalen Mittel- und Unterfeld V. a. einzelne bronchopneumonische Herde – diesbezüglich Kontrollröntgen nach entsprechender Therapie in 8-14 Tagen indiziert.
- Allenfalls geringe feinstreifige Transparenzminderung suprabasal bds.; in erster Linie überlagerungsbedingt zu werten, DD bei entsprechender Klinik/Labor residuelle bzw. inzipiente infiltrative Veränderung möglich.
### Pleura / Hili
- Abgerundete Pleurasinus bds., vereinbar mit geringen bilateralen Sinusschwielen, DD inzipiente Pleuraergüsse nicht auszuschließen.
- Flächige Transparenzminderungen im Herz-Zwerchfell-Winkel bds. – wie durch adhäsive Veränderungen bedingt.

### Sonstiges
- Retrokardialer Kernschatten mit Gasflüssigkeitsspiegelbildung, in erster Linie im Rahmen einer größeren Hiatushernie möglich.

- Es zeigt sich eine ausgeprägte, exzentrisch konfigurierte Kalkplaqueformation in der ACC mit einer Breite von etwa 4,2 mm sowie einer Länge von bis etwa 2 cm und einer bildmorphologischen Stenose von etwa 40 %. ⟶ Keine hämodynamisch relevanten Stenosen

- An der rechten Arteria carotis interna reguläre maximale Flussgeschwindigkeiten. ⟶ Die Flussprofile sind regelrecht
- Elongation und Kinking der Arteria carotis interna. ⟶ +

Regelrechte Darstellung der langen Bizepssehne im Sulcus intertubercularis ohne Nachweis einer Luxation oder relevanten Tenosynovitis.

const CALCS = {
  fleischner: {

    src: "MacMahon H et al. Guidelines for Management of Incidental Pulmonary Nodules Detected on CT Images: From the Fleischner Society 2017. Radiology 2017;284:228–243",

      {id:"typ", label:"Art", type:"seg", opts:[["solid","Solide"],["gg","Milchglas (rein)"],["ps","Teilsolide"]], def:"solid"},

function parseData(src){
  const out = []; let t = null, s = null;
  const close = () => {
    if (!s) return;
    if (s.lines){ while (s.lines.length && !s.lines[0].trim()) s.lines.shift(); while (s.lines.length && !s.lines[s.lines.length-1].trim()) s.lines.pop(); }
    if (s.type==="block"||s.type==="variant"){ s.text = s.lines.join("\n"); delete s.lines; }
    if (s.groups) s.groups = s.groups.filter(g=>g.items.length);
    t.sections.push(s); s = null;
  };
  for (const raw of src.split("\n")){
    const l = raw.replace(/\s+$/,"");
    if (l.startsWith("=== ")){
      if (t){ close(); out.push(t); }
      const p = l.slice(4).split("|").map(x=>x.trim());
      t = {mod:MODMAP[p[0]], region:p[1], title:p[2], keys:p[3]||"", fav:p.slice(4).includes("fav"), base:(p.slice(4).find(x=>x.startsWith("base="))||"").slice(5), subj:(p.slice(4).find(x=>x.startsWith("subj="))||"").slice(5), sections:[]};
      continue;
    }
    if (!t) continue;
    if (l.startsWith("## ")){
      close(); const x = l.slice(3).trim(), c = x[0];
      if (c==="*") s = {type:"items", title:x.slice(1).trim(), groups:[{label:"",items:[]}], hints:[]};
      else if (c==="?") s = {type:"info", title:x.slice(1).trim(), lines:[], hints:[]};
      else if (c==="@") s = {type:"variant", title:x.slice(1).trim(), lines:[], hints:[]};
      else if (c==="%"){ const id = x.slice(1).trim(); s = {type:"calc", calc:id, title:(CALCS[id]||{}).title||id, hints:[]}; }
      else { const st = splitTarget(x); s = {type:"block", title:st.text, to:st.to, lines:[], hints:[]}; }
      continue;
    }
    if (!s) continue;
    if (l.startsWith("> ")){ s.hints.push(l.slice(2)); continue; }
    if (s.type==="items"){
      if (l.startsWith("### ")) s.groups.push({label:l.slice(4).trim(), items:[]});
      else if (l.startsWith("- ")) s.groups[s.groups.length-1].items.push(splitTarget(l.slice(2)));
    } else if (s.lines) s.lines.push(l);
  }
  if (t){ close(); out.push(t); }
  out.forEach((x,i)=>{ x.id = i; const j = JSON.stringify(x.sections); x.ph = j.includes("[XXX]") || j.includes("[rechts/links]"); });
  return out;
}
const DATA = parseData(document.getElementById("data").textContent);

/* ---------- list ---------- */
function score(t, toks){
  let s = 0;
  for (const k of toks){
    if (t.meta.includes(k)) s += t.title.toLowerCase().includes(k) ? 10 : 6;
    else if (t.full.includes(k)) s += 1;
    else return 0;
  }
  return s;
}
function sortStd(a,b){
  return MODS.indexOf(a.mod)-MODS.indexOf(b.mod) || REGORDER.indexOf(a.region)-REGORDER.indexOf(b.region) || a.title.localeCompare(b.title,"de");
}
function renderList(autoselect){
  const q = S.q.trim().toLowerCase();
  let items;
  if (q){
    const toks = q.split(/\s+/);
    items = DATA.map(t=>[t,score(t,toks)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||sortStd(a[0],b[0])).map(x=>x[0]);
  } else if (S.filter==="fav"){ items = DATA.filter(isFav).sort(sortStd); }
  else if (S.filter==="recent"){ items = S.recent.map(k=>DATA.find(t=>key(t)===k)).filter(Boolean); }
  else if (S.filter==="all"){ items = DATA.slice().sort(sortStd); }
  else if (S.filter==="top"){ items = DATA.filter(t=>S.use[key(t)]).sort((a,b)=>S.use[key(b)]-S.use[key(a)]||sortStd(a,b)); }
  else if (S.filter==="calc"){ items = DATA.filter(t=>t.sections.some(s=>s.type==="calc")).sort(sortStd); }
  else { items = DATA.filter(t=>t.mod===S.filter).sort(sortStd); }
  S.visible = items;
  let h = "";
  if (!items.length){
    h = q ? `<div class="empty">Nichts gefunden für „${esc(S.q)}“.</div>`
          : S.filter==="fav" ? `<div class="empty">Noch keine Favoriten. In einer Vorlage auf ☆ klicken.</div>`
          : S.filter==="top" ? `<div class="empty">Noch nichts gezählt. Das Cockpit zählt mit, welche Vorlagen du kopierst (auf diesem Gerät).</div>`
          : `<div class="empty">Noch nichts geöffnet.</div>`;
  }
  const grouped = !q && S.filter!=="recent" && S.filter!=="top";
  let lastMod = null, lastReg = null;
  for (const t of items){
    if (grouped){
      if (S.filter==="fav" || S.filter==="all" || S.filter==="calc"){
        if (t.mod!==lastMod){ h += `<div class="grp"><span class="dot" style="background:${col(t.mod)}"></span>${esc(t.mod)}</div>`; lastMod=t.mod; lastReg=null; }
        if (S.filter==="all" && t.region!==lastReg){ h += `<div class="sub">${esc(t.region)}</div>`; lastReg=t.region; }
      } else if (t.region!==lastReg){ h += `<div class="grp">${esc(t.region)}</div>`; lastReg=t.region; }
    }

    const dot = (!grouped) ? `<span class="dot" style="background:${col(t.mod)}"></span>` : "";
    h += `<div class="li${S.sel===t.id?" sel":""}" data-id="${t.id}" role="button" tabindex="-1">${dot}<span class="t">${esc(t.title)}</span>${mtag}${t.ph?'<span class="b" title="enthält Platzhalter">✎</span>':""}${isFav(t)?'<span class="b">⭐</span>':""}</div>`;
  }

/* ---------- detail ---------- */
function fmt(s){
  let h = esc(s).replace(/\[XXX\]/g, "\u0001");
  h = h.replace(/\[([^\[\]\n]*)\]/g, (m) => `<span class="opt">${m}</span>`);
  return h.replace(/\u0001/g, '<mark class="ph">[XXX]</mark>');
}
function fmtBlock(s){
  let h = "";
  for (const l of s.split("\n")){
    h += l.trim() ? `<div class="ln">${fmt(l)}</div>` : '<div class="gap"></div>';
  }
  return h;
}
function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function infoHtml(lines){
  let h = "", i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (l.startsWith("|")){
      h += "<table>";
      while (i < lines.length && lines[i].startsWith("|")){
        const cells = lines[i].split("|").slice(1,-1).map(c=>c.trim());
        h += "<tr>"+cells.map(c=>`<td>${inl(c)}</td>`).join("")+"</tr>"; i++;
      }
      h += "</table>"; continue;
    }
    if (l.startsWith("- ")){ h += "<ul>"; while (i<lines.length && lines[i].startsWith("- ")){ h += `<li>${inl(lines[i].slice(2))}</li>`; i++; } h += "</ul>"; continue; }
    if (/^\d+\. /.test(l)){ h += "<ol>"; while (i<lines.length && /^\d+\. /.test(lines[i])){ h += `<li>${inl(lines[i].replace(/^\d+\. /,""))}</li>`; i++; } h += "</ol>"; continue; }
    if (l.trim()) h += `<p>${inl(l)}</p>`;
    i++;
  }
  return h;
}
function hints(s){ return (s.hints||[]).map(x=>`<div class="hint">💡 ${inl(x)}</div>`).join(""); }

function select(id, user){

        });
      });

/* ---------- copy ---------- */
async function copyText(text){
  try{ if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); if (ok) return true;
  }catch(e){}
  return false;
}
async function doCopy(text, el){
  if (el && !el.closest) el = null;
  const ok = await copyText(text);
  if (ok){
    toast("✓ Kopiert – jetzt Strg/Cmd + V");
    if (el){
      const target = el.closest(".item") || el.closest(".card");
      if (target){ target.classList.add("flash"); setTimeout(()=>target.classList.remove("flash"), 700); }
      const btn = target && target.querySelector(".copy");
      if (btn){ const o = btn.innerHTML; btn.classList.add("ok"); btn.innerHTML = "✓ Kopiert"; setTimeout(()=>{btn.classList.remove("ok"); btn.innerHTML = o;}, 1100); }
    }
  } else {
    manualCopy(text);
  }
}
function copyUnit(i, el){
  const u = S.units[i]; if (!u) return;
  const txt = resolveUnit(i); doCopy(txt, el); bump(u.tpl);
  const open = (txt.match(/\[XXX\]/g) || []).length;
  if (open) setTimeout(() => toast(`✓ Kopiert – noch ${open}× [XXX] offen`), 30);
}

  $("#mbox").innerHTML = `<h2>Bitte manuell kopieren</h2><p style="margin:0 0 8px;color:var(--mute);font-size:13px">Der Browser blockiert automatisches Kopieren hier. Text ist markiert – einfach <b>Strg/Cmd + C</b> drücken.</p><textarea id="mta"></textarea><div class="row"><button class="copy" id="mclose">Fertig</button></div>`;
  const ta = $("#mta"); ta.value = text; $("#modal").classList.add("on"); ta.focus(); ta.select();
  $("#mclose").onclick = closeModal;
}
function closeModal(){ $("#modal").classList.remove("on"); }

  S.kit.items.forEach(it => it.target ? (by[it.target.k+":"+it.target.j] = by[it.target.k+":"+it.target.j] || []).push(it) : tail.push(it));

      const pre = s.type==="items" ? "*" : s.type==="info" ? "?" : s.type==="variant" ? "@" : "";

      else if (s.type==="info") out.push(...(s.lines||[]));

function tokenizeLine(s, ctr){

    const re = /(rechts\s*\/\s*links|links\s*\/\s*rechts)/gi; let m, last = 0;

  for (const [k, idx] of groups){
    const t = tplByRef(DATA, S.inbox[idx[0]]);
    const sents = t ? draftBaseSentences(stripTpl(t)) : [];
    h += `<div class="sech">${esc(k)}${t ? "" : " – Vorlage nicht gefunden"}</div>`;
    for (const i of idx){
      const x = S.inbox[i], on = S.ibSel.has(i);
      h += `<div class="ibrow${on ? " on" : ""}"><input type="checkbox" data-ibc="${i}"${on ? " checked" : ""} aria-label="auswählen"><textarea data-ibt="${i}" rows="${Math.max(1, Math.ceil(x.text.length / 95))}">${esc(x.text)}</textarea><select data-ibto="${i}" aria-label="Ziel">${targetOpts(x.to, sents)}</select><div class="ibsrc">${esc(x.note || "")}</div></div>`;
    }
  }
  h += `</div>`;
  $("#detail").innerHTML = h;
}
function ibBar(){
  const n = S.ibSel.size, tk = document.querySelector('[data-ib="take"]'), dr = document.querySelector('[data-ib="drop"]'), al = document.querySelector('[data-ib="all"]');
  if (tk){ tk.disabled = !n; tk.textContent = `✓ Auswahl übernehmen (${n})`; }
  if (dr) dr.disabled = !n;
  if (al) al.textContent = (n === S.inbox.length ? "Keine" : "Alle") + " auswählen";
}
function inboxClick(e){
  const b = e.target.closest("[data-ib]"); if (!b) return;
  const a = b.dataset.ib;
  if (a === "close"){ S.view = null; renderDetail(); return; }
  if (a === "all"){ if (S.ibSel.size === S.inbox.length) S.ibSel.clear(); else S.inbox.forEach((_, i) => S.ibSel.add(i)); renderInbox(); return; }
  const rest = S.inbox.filter((_, i) => !S.ibSel.has(i));
  if (a === "drop"){ publishList(DATA.map(stripTpl), null, "Verworfen – Cockpit lädt neu …", rest); return; }
  if (a === "take"){
    const list = DATA.map(stripTpl); let added = 0;
    [...S.ibSel].sort((p, q) => p - q).forEach(i => {
      const x = S.inbox[i], t = tplByRef(list, x); if (!t || !one(x.text)) return;
      let sec = t.sections.find(s => s.type === "items");
      if (!sec){ sec = {type:"items", title:"Textbausteine", groups:[], hints:[]}; t.sections.push(sec); }
      let g = sec.groups.find(g => g.label === (x.group || "")); if (!g){ g = {label:x.group || "", items:[]}; sec.groups.push(g); }
      g.items.push({text:one(x.text), to:x.to || null}); added++;
    });
    publishList(list, null, `✓ ${added} Bausteine übernommen – Cockpit lädt neu …`, rest);
  }
}
$("#detail").addEventListener("change", e => {
  if (S.view !== "inbox") return; const el = e.target;
  if (el.dataset.ibc != null){ const i = +el.dataset.ibc; el.checked ? S.ibSel.add(i) : S.ibSel.delete(i); el.closest(".ibrow").classList.toggle("on", el.checked); ibBar(); }
  if (el.dataset.ibto != null) S.inbox[+el.dataset.ibto].to = el.value || null;
});
$("#detail").addEventListener("input", e => { if (S.view === "inbox" && e.target.dataset.ibt != null) S.inbox[+e.target.dataset.ibt].text = e.target.value; });

/* ---------- sicherung, website & pflege ---------- */
const SITE = "https://karfuuu.github.io/";
const SAVED = (document.getElementById("data") || {dataset:{}}).dataset.saved || "";
const savedLabel = () => { const d = new Date(SAVED); return isNaN(d) ? "unbekannt" : d.toLocaleString("de-AT", {dateStyle:"medium", timeStyle:"short"}); };
function currentDoc(){ return buildDoc(toDSL(DATA.map(stripTpl)), S.inbox); }
async function downloadBackup(){
  const html = currentDoc(), name = "befund-cockpit-" + new Date().toISOString().slice(0, 10) + ".html";
  let DL = null; try { DL = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; } catch(e){}
  if (DL){
    try { await DL.save({filename:name, data:html}); toast("✓ Sicherung gespeichert"); return; }
    catch(e){ if (e && e.code === "declined") return; if (e && e.code === "rate_limited"){ toast("Bitte kurz warten und erneut versuchen."); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("✓ Sicherung wird heruntergeladen");
  } catch(e){ toast("Download hier nicht möglich."); }
}
function restoreFrom(text){
  const m = text.match(/<script type="text\/plain" id="data"[^>]*>\n?([\s\S]*?)\n?<\/script>/);
  if (!m){ toast("Keine Cockpit-Sicherung erkannt."); return; }
  const list = parseData(m[1]).map(stripTpl);
  if (!list.length){ toast("Die Sicherung enthält keine Vorlagen."); return; }
  let ib = S.inbox; const mi = text.match(/<script type="application\/json" id="inbox">([\s\S]*?)<\/script>/);
  if (mi){ try { const x = JSON.parse(mi[1]); if (Array.isArray(x)) ib = x; } catch(e){} }
  $("#mbox").innerHTML = `<h2>Sicherung wiederherstellen?</h2><p style="font-size:13px">Die Sicherung enthält <b>${list.length} Vorlagen</b> (aktuell: ${DATA.length}). Der aktuelle Stand wird ersetzt.</p><div class="row"><button class="mini" id="mclose">Abbrechen</button><button class="copy" id="rs-go">Wiederherstellen</button></div>`;
  $("#mclose").onclick = closeModal;
  $("#rs-go").onclick = () => { closeModal(); publishList(list, null, "✓ Wiederhergestellt – Cockpit lädt neu …", ib); };
}
function openMenu(){
  const top = Object.entries(S.use).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $("#mbox").innerHTML = `<h2>Sicherung, Website & Pflege</h2>
  <p class="mp">Stand dieser Version: <b>${esc(savedLabel())}</b> · ${DATA.length} Vorlagen</p>
  <div class="mrow"><button class="copy" id="bk-dl">📦 Sicherung herunterladen</button><span>Komplettes Cockpit als eine HTML-Datei. Läuft offline per Doppelklick – ohne Internet und ohne Claude.</span></div>
  ${S.canEdit ? `<div class="mrow"><label class="add" style="cursor:pointer">♻️ Sicherung wiederherstellen<input type="file" id="bk-file" accept=".html,text/html" hidden></label><span>Vorlagen aus einer Sicherungsdatei laden und hier speichern.</span></div>` : ""}
  <h3>🌐 Website – von überall, ohne Anmeldung</h3>
  <p class="mp"><a href="${SITE}" target="_blank" rel="noopener">${SITE.replace("https://", "").replace(/\/$/, "")}</a> – nur zum Ansehen und Kopieren. Bearbeitet wird hier im Claude-Cockpit.</p>
  <p class="mp">Website aktualisieren: Sicherung herunterladen → auf <a href="https://github.com/karfuuu/karfuuu.github.io/upload/main" target="_blank" rel="noopener">GitHub hochladen</a> und dabei in <b>index.html</b> umbenennen → „Commit changes“. Oder Claude sagen: „Website aktualisieren“.</p>
  <h3>📊 Meistgenutzt (dieses Gerät)</h3>
  <p class="mp">${top.length ? top.map(([k, n]) => `${esc(k.split("|")[1])} ${esc(k.split("|")[0])}: <b>${n}×</b>`).join(" · ") : "Noch keine Kopien gezählt."} ${top.length ? '<button class="mini" id="bk-reset">Zähler zurücksetzen</button>' : ""}</p>
  <div class="row"><button class="copy" id="mclose">Schließen</button></div>`;
  $("#modal").classList.add("on");
  $("#mclose").onclick = closeModal;
  $("#bk-dl").onclick = downloadBackup;
  const fi = $("#bk-file"); if (fi) fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(f); };
  const rs = $("#bk-reset"); if (rs) rs.onclick = () => { S.use = {}; store.set("use", {}); closeModal(); renderList(false); toast("Zähler zurückgesetzt"); };
}
$("#menubtn").onclick = openMenu;


/* ---------- search & keys ---------- */
const qi = $("#q");
qi.addEventListener("input", () => { S.q = qi.value; renderList(true); });
qi.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); move(e.key==="ArrowDown"?1:-1); }
  else if (e.key === "Enter"){ e.preventDefault(); if (S.units.length) copyUnit(0, document.querySelector('[data-u="0"]')); }
  else if (e.key === "Escape"){ if (qi.value){ qi.value=""; S.q=""; renderList(true); } else qi.blur(); }
});
function move(d){
  const v = S.visible; if (!v.length) return;
  let i = v.findIndex(t=>t.id===S.sel); i = i<0 ? 0 : Math.max(0, Math.min(v.length-1, i+d));
  select(v[i].id, true);
}
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("on")){ if (e.key==="Escape") closeModal(); return; }
  if (e.target === qi) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (S.edit){ if (e.key === "Escape" && confirmLeave()){ S.edit = null; renderDetail(); } return; }
  if (e.key === "/" || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k")){ e.preventDefault(); qi.focus(); qi.select(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view) return;
  if (/^[1-9]$/.test(e.key)){ const i = +e.key-1; const u = S.units[i]; if (u && !u.item) copyUnit(i, document.querySelector(`[data-u="${i}"]`)); return; }
  if ((e.key === "r" || e.key === "l") && S.hasSide){ setSide(e.key === "r" ? "rechts" : "links"); return; }
  if (e.key === "ArrowDown" || e.key === "j"){ e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp" || e.key === "k"){ e.preventDefault(); move(-1); }
  else if (e.key === "f"){ toggleFav(); }
});
$("#helpbtn").onclick = () => {
  $("#mbox").innerHTML = `<h2>Tastenkürzel</h2><table class="help">
  <tr><td><kbd>/</kbd> oder <kbd>Strg K</kbd></td><td>Suche</td></tr>
  <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>Vorlage wechseln (auch während der Suche)</td></tr>
  <tr><td><kbd>Enter</kbd> (in der Suche)</td><td>Standardbefund kopieren</td></tr>
  <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>Befundblock Nr. 1–9 kopieren</td></tr>
  <tr><td><kbd>F</kbd></td><td>Favorit an/aus</td></tr>
  <tr><td><kbd>R</kbd> / <kbd>L</kbd></td><td>Seite rechts / links für alle [rechts/links]</td></tr>
  <tr><td><kbd>Enter</kbd> (im Feld)</td><td>nächstes [XXX]-Feld · <kbd>Strg Enter</kbd> = kopieren</td></tr>
  <tr><td><kbd>Esc</kbd></td><td>Suche leeren / Bearbeiten abbrechen</td></tr></table>
  <p style="font-size:13px;color:var(--mute);margin:10px 0 0"><b>Bearbeiten:</b> „✏️ Bearbeiten“ oben bei jeder Vorlage, „＋ Neue Vorlage“ oben in der Liste. Mit „💾 Speichern“ dauerhaft sichern.</p>
  <p style="font-size:13px;color:var(--mute);margin:10px 0 0"><b>Ausfüllen:</b> <mark class="ph">[XXX]</mark>-Felder direkt im Text ausfüllen, Auswahlfelder wie [I/II/III] aufklappen, <span class="opt">[optionale Teile]</span> anklicken (✓ übernehmen → ✗ weglassen → offen). Kopiert wird der fertige Text. · <b>🧮 Rechner:</b> Fleischner, Bosniak, LI-RADS, PI-RADS, TI-RADS, Nebenniere, Volumen – mit fertigem Befundsatz. · <b>⋯</b> oben: Sicherung & Website.</p>
  <p style="font-size:13px;color:var(--mute);margin:10px 0 0">Klick auf Text = kopieren · <b>Befund-Baukasten:</b> beim Standardbefund „＋ Als Basis“, bei Pathologien „＋“ – sie ersetzen automatisch die passende Normalzeile (in der Vorschau änderbar), dann „📋 Befund kopieren“ · <mark class="ph">[XXX]</mark> ausfüllen · <span class="opt">[…]</span> optional.<br>Tastenkürzel funktionieren, sobald du einmal in das Cockpit geklickt hast.</p>
  <div class="row"><button class="copy" id="mclose">OK</button></div>`;
  $("#modal").classList.add("on"); $("#mclose").onclick = closeModal;
};

/* ---------- init ---------- */
renderPills();
const last = store.get("last", null);
const lastT = last && DATA.find(t=>key(t)===last);
S.sel = (lastT || DATA.find(isFav) || DATA[0]).id;
renderList(false);
if (lastT && !S.visible.some(t=>t.id===S.sel)){ S.filter = lastT.mod; renderPills(); renderList(false); }
if (!S.visible.some(t=>t.id===S.sel) && S.visible.length) S.sel = S.visible[0].id;
renderList(false);
renderDetail();
</script>
